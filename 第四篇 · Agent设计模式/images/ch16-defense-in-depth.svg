<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="22" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Agent 纵深防御体系</text>

  <!-- Concentric layers (outer to inner) -->
  <!-- L5: Rate Limiting (outermost) -->
  <rect x="40" y="45" width="480" height="330" rx="16" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5" opacity="0.7"/>
  <text x="280" y="62" text-anchor="middle" font-size="10" font-weight="700" fill="#991b1b">L5 限流 (Rate Limiting)</text>
  <text x="280" y="74" text-anchor="middle" font-size="8" fill="#ef4444">Token 预算 · API 限流 · 并发控制</text>

  <!-- L4: Circuit Breaker -->
  <rect x="70" y="85" width="420" height="270" rx="14" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5" opacity="0.8"/>
  <text x="280" y="102" text-anchor="middle" font-size="10" font-weight="700" fill="#991b1b">L4 熔断 (Circuit Breaker)</text>
  <text x="280" y="114" text-anchor="middle" font-size="8" fill="#ef4444">连续失败 → 暂停 → 探测 → 恢复</text>

  <!-- L3: Fallback -->
  <rect x="100" y="125" width="360" height="210" rx="12" fill="#ffedd5" stroke="#f97316" stroke-width="1.5" opacity="0.8"/>
  <text x="280" y="142" text-anchor="middle" font-size="10" font-weight="700" fill="#7c2d12">L3 降级 (Fallback)</text>
  <text x="280" y="154" text-anchor="middle" font-size="8" fill="#f97316">LLM 超时 → 模板回复 · 模型不可用 → 备选模型</text>

  <!-- L2: Guardrails -->
  <rect x="130" y="165" width="300" height="150" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5" opacity="0.85"/>
  <text x="280" y="182" text-anchor="middle" font-size="10" font-weight="700" fill="#78350f">L2 护栏 (Guardrails)</text>
  <text x="280" y="194" text-anchor="middle" font-size="8" fill="#f59e0b">输入过滤 · 输出审核 · 敏感信息扫描</text>

  <!-- L1: Exception Handling -->
  <rect x="160" y="205" width="240" height="90" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="280" y="222" text-anchor="middle" font-size="10" font-weight="700" fill="#1e3a8a">L1 异常处理 (Exception)</text>
  <text x="280" y="234" text-anchor="middle" font-size="8" fill="#3b82f6">try-catch · 错误重试 · 日志记录</text>

  <!-- Core: Agent Logic -->
  <rect x="200" y="245" width="160" height="40" rx="6" fill="#1e293b" stroke="#1e293b"/>
  <text x="280" y="260" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">Agent 核心逻辑</text>
  <text x="280" y="274" text-anchor="middle" font-size="8" fill="#cbd5e1">LLM + 工具 + 流程模式</text>

  <!-- Attack arrows from outside -->
  <text x="20" y="100" font-size="8" fill="#94a3b8" font-style="italic">攻击/异常</text>
  <path d="M 15 110 L 38 110" stroke="#ef4444" stroke-width="1.5" fill="none" stroke-dasharray="3,2"/>
  <path d="M 15 160 L 66 160" stroke="#ef4444" stroke-width="1" fill="none" stroke-dasharray="3,2"/>
  <path d="M 15 210 L 96 210" stroke="#f97316" stroke-width="1" fill="none" stroke-dasharray="3,2"/>
  <path d="M 15 260 L 126 260" stroke="#f59e0b" stroke-width="1" fill="none" stroke-dasharray="3,2"/>
  <path d="M 15 300 L 156 300" stroke="#3b82f6" stroke-width="1" fill="none" stroke-dasharray="3,2"/>

  <!-- Labels for each layer's defense -->
  <text x="540" y="62" text-anchor="end" font-size="7" fill="#991b1b">阻止过载</text>
  <text x="540" y="102" text-anchor="end" font-size="7" fill="#991b1b">阻止级联</text>
  <text x="540" y="142" text-anchor="end" font-size="7" fill="#7c2d12">保底可用</text>
  <text x="540" y="182" text-anchor="end" font-size="7" fill="#78350f">内容安全</text>
  <text x="540" y="222" text-anchor="end" font-size="7" fill="#1e3a8a">错误兜底</text>

  <!-- Bottom note -->
  <text x="280" y="392" text-anchor="middle" font-size="8" fill="#94a3b8">外层挡住大部分威胁，内层处理漏网的异常。核心逻辑永远不直接面对原始攻击。</text>
</svg>
