<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="arr15a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="20" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">五种工作流模式一览</text>

  <!-- P01 Prompt Chaining -->
  <rect x="20" y="40" width="100" height="22" rx="4" fill="#dbeafe" stroke="#3b82f6" stroke-width="1"/>
  <text x="70" y="55" text-anchor="middle" font-size="9" font-weight="600" fill="#1e3a8a">P01 提示链</text>
  <rect x="30" y="72" width="36" height="18" rx="3" fill="#fff" stroke="#3b82f6" stroke-width="1"/>
  <text x="48" y="85" text-anchor="middle" font-size="8" fill="#1e3a8a">步骤1</text>
  <path d="M 66 81 L 76 81" stroke="#64748b" stroke-width="1" fill="none" marker-end="url(#arr15a)"/>
  <rect x="76" y="72" width="36" height="18" rx="3" fill="#fff" stroke="#3b82f6" stroke-width="1"/>
  <text x="94" y="85" text-anchor="middle" font-size="8" fill="#1e3a8a">步骤2</text>
  <path d="M 112 81 L 118 81" stroke="#64748b" stroke-width="1" fill="none" marker-end="url(#arr15a)"/>
  <rect x="118" y="72" width="36" height="18" rx="3" fill="#fff" stroke="#3b82f6" stroke-width="1"/>
  <text x="136" y="85" text-anchor="middle" font-size="8" fill="#1e3a8a">步骤3</text>
  <text x="70" y="104" text-anchor="middle" font-size="8" fill="#64748b">顺序流水线</text>

  <!-- P02 Routing -->
  <rect x="160" y="40" width="100" height="22" rx="4" fill="#dcfce7" stroke="#22c55e" stroke-width="1"/>
  <text x="210" y="55" text-anchor="middle" font-size="9" font-weight="600" fill="#14532d">P02 路由</text>
  <rect x="192" y="72" width="36" height="18" rx="3" fill="#fff" stroke="#22c55e" stroke-width="1"/>
  <text x="210" y="85" text-anchor="middle" font-size="8" fill="#14532d">分类</text>
  <path d="M 210 90 L 175 100" stroke="#64748b" stroke-width="1" fill="none" marker-end="url(#arr15a)"/>
  <path d="M 210 90 L 210 100" stroke="#64748b" stroke-width="1" fill="none" marker-end="url(#arr15a)"/>
  <path d="M 210 90 L 245 100" stroke="#64748b" stroke-width="1" fill="none" marker-end="url(#arr15a)"/>
  <rect x="155" y="100" width="36" height="14" rx="3" fill="#fff" stroke="#22c55e" stroke-width="0.8"/>
  <text x="173" y="111" text-anchor="middle" font-size="7" fill="#14532d">路径A</text>
  <rect x="192" y="100" width="36" height="14" rx="3" fill="#fff" stroke="#22c55e" stroke-width="0.8"/>
  <text x="210" y="111" text-anchor="middle" font-size="7" fill="#14532d">路径B</text>
  <rect x="229" y="100" width="36" height="14" rx="3" fill="#fff" stroke="#22c55e" stroke-width="0.8"/>
  <text x="247" y="111" text-anchor="middle" font-size="7" fill="#14532d">路径C</text>
  <text x="210" y="128" text-anchor="middle" font-size="8" fill="#64748b">条件分发</text>

  <!-- P03 Parallelization -->
  <rect x="300" y="40" width="100" height="22" rx="4" fill="#fed7aa" stroke="#f97316" stroke-width="1"/>
  <text x="350" y="55" text-anchor="middle" font-size="9" font-weight="600" fill="#7c2d12">P03 并行化</text>
  <rect x="333" y="72" width="34" height="14" rx="3" fill="#fff" stroke="#f97316" stroke-width="1"/>
  <text x="350" y="83" text-anchor="middle" font-size="7" fill="#7c2d12">输入</text>
  <path d="M 350 86 L 322 96" stroke="#64748b" stroke-width="1" fill="none" marker-end="url(#arr15a)"/>
  <path d="M 350 86 L 350 96" stroke="#64748b" stroke-width="1" fill="none" marker-end="url(#arr15a)"/>
  <path d="M 350 86 L 378 96" stroke="#64748b" stroke-width="1" fill="none" marker-end="url(#arr15a)"/>
  <rect x="310" y="96" width="24" height="12" rx="2" fill="#fff" stroke="#f97316" stroke-width="0.8"/>
  <text x="322" y="105" text-anchor="middle" font-size="7" fill="#7c2d12">分1</text>
  <rect x="338" y="96" width="24" height="12" rx="2" fill="#fff" stroke="#f97316" stroke-width="0.8"/>
  <text x="350" y="105" text-anchor="middle" font-size="7" fill="#7c2d12">分2</text>
  <rect x="366" y="96" width="24" height="12" rx="2" fill="#fff" stroke="#f97316" stroke-width="0.8"/>
  <text x="378" y="105" text-anchor="middle" font-size="7" fill="#7c2d12">分3</text>
  <path d="M 322 108 L 350 118" stroke="#64748b" stroke-width="1" fill="none"/>
  <path d="M 350 108 L 350 118" stroke="#64748b" stroke-width="1" fill="none"/>
  <path d="M 378 108 L 350 118" stroke="#64748b" stroke-width="1" fill="none" marker-end="url(#arr15a)"/>
  <rect x="333" y="118" width="34" height="14" rx="3" fill="#fff" stroke="#f97316" stroke-width="1"/>
  <text x="350" y="129" text-anchor="middle" font-size="7" fill="#7c2d12">聚合</text>
  <text x="350" y="143" text-anchor="middle" font-size="8" fill="#64748b">并行执行</text>

  <!-- P04 Orchestrator-Worker -->
  <rect x="440" y="40" width="100" height="22" rx="4" fill="#e0e7ff" stroke="#6366f1" stroke-width="1"/>
  <text x="490" y="55" text-anchor="middle" font-size="9" font-weight="600" fill="#3730a3">P04 编排者</text>
  <rect x="468" y="72" width="44" height="16" rx="3" fill="#6366f1" stroke="#6366f1" stroke-width="1"/>
  <text x="490" y="84" text-anchor="middle" font-size="8" font-weight="600" fill="#fff">编排者</text>
  <path d="M 480 88 L 460 98" stroke="#64748b" stroke-width="1" fill="none" marker-end="url(#arr15a)"/>
  <path d="M 490 88 L 490 98" stroke="#64748b" stroke-width="1" fill="none" marker-end="url(#arr15a)"/>
  <path d="M 500 88 L 520 98" stroke="#64748b" stroke-width="1" fill="none" marker-end="url(#arr15a)"/>
  <rect x="448" y="98" width="24" height="12" rx="2" fill="#fff" stroke="#6366f1" stroke-width="0.8"/>
  <text x="460" y="107" text-anchor="middle" font-size="7" fill="#3730a3">工1</text>
  <rect x="478" y="98" width="24" height="12" rx="2" fill="#fff" stroke="#6366f1" stroke-width="0.8"/>
  <text x="490" y="107" text-anchor="middle" font-size="7" fill="#3730a3">工2</text>
  <rect x="508" y="98" width="24" height="12" rx="2" fill="#fff" stroke="#6366f1" stroke-width="0.8"/>
  <text x="520" y="107" text-anchor="middle" font-size="7" fill="#3730a3">工3?</text>
  <text x="490" y="125" text-anchor="middle" font-size="8" fill="#64748b">动态分配</text>

  <!-- Divider -->
  <line x1="20" y1="160" x2="540" y2="160" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- P05 Evaluator-Optimizer (centered, larger) -->
  <rect x="180" y="180" width="200" height="22" rx="4" fill="#fce7f3" stroke="#ec4899" stroke-width="1"/>
  <text x="280" y="195" text-anchor="middle" font-size="9" font-weight="600" fill="#831843">P05 评估器-优化器</text>

  <rect x="210" y="215" width="60" height="22" rx="4" fill="#fff" stroke="#ec4899" stroke-width="1"/>
  <text x="240" y="230" text-anchor="middle" font-size="9" fill="#831843">生成器</text>

  <path d="M 270 226 L 300 226" stroke="#64748b" stroke-width="1" fill="none" marker-end="url(#arr15a)"/>
  <text x="285" y="220" text-anchor="middle" font-size="7" fill="#64748b">草稿</text>

  <rect x="300" y="215" width="60" height="22" rx="4" fill="#fff" stroke="#ec4899" stroke-width="1"/>
  <text x="330" y="230" text-anchor="middle" font-size="9" fill="#831843">评估器</text>

  <!-- Loop back arrow -->
  <path d="M 330 237 Q 330 260 240 260 Q 240 243 240 237" stroke="#ec4899" stroke-width="1" fill="none" marker-end="url(#arr15a)" stroke-dasharray="3,2"/>
  <text x="285" y="272" text-anchor="middle" font-size="7" fill="#ec4899" font-style="italic">未达标 → 反馈重试</text>

  <!-- Output arrow -->
  <path d="M 360 226 L 390 226" stroke="#64748b" stroke-width="1" fill="none" marker-end="url(#arr15a)"/>
  <text x="375" y="220" text-anchor="middle" font-size="7" fill="#22c55e" font-weight="600">达标</text>
  <rect x="390" y="215" width="50" height="22" rx="4" fill="#22c55e" stroke="#22c55e" stroke-width="1"/>
  <text x="415" y="230" text-anchor="middle" font-size="9" font-weight="600" fill="#fff">输出</text>

  <!-- Bottom section: Enhancement patterns -->
  <line x1="20" y1="300" x2="540" y2="300" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="280" y="318" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">增强优化模式</text>

  <!-- 4 enhancement patterns in a row -->
  <rect x="40" y="330" width="110" height="50" rx="6" fill="#f0fdf4" stroke="#22c55e" stroke-width="1"/>
  <text x="95" y="348" text-anchor="middle" font-size="10" font-weight="600" fill="#14532d">反思</text>
  <text x="95" y="362" text-anchor="middle" font-size="8" fill="#22c55e">Reflection</text>
  <text x="95" y="374" text-anchor="middle" font-size="7" fill="#64748b">自我评估迭代</text>

  <rect x="165" y="330" width="110" height="50" rx="6" fill="#f0fdf4" stroke="#22c55e" stroke-width="1"/>
  <text x="220" y="348" text-anchor="middle" font-size="10" font-weight="600" fill="#14532d">规划</text>
  <text x="220" y="362" text-anchor="middle" font-size="8" fill="#22c55e">Planning</text>
  <text x="220" y="374" text-anchor="middle" font-size="7" fill="#64748b">先计划再执行</text>

  <rect x="290" y="330" width="110" height="50" rx="6" fill="#f0fdf4" stroke="#22c55e" stroke-width="1"/>
  <text x="345" y="348" text-anchor="middle" font-size="10" font-weight="600" fill="#14532d">工具使用</text>
  <text x="345" y="362" text-anchor="middle" font-size="8" fill="#22c55e">Tool Use</text>
  <text x="345" y="374" text-anchor="middle" font-size="7" fill="#64748b">能力扩展</text>

  <rect x="415" y="330" width="110" height="50" rx="6" fill="#f0fdf4" stroke="#22c55e" stroke-width="1"/>
  <text x="470" y="348" text-anchor="middle" font-size="10" font-weight="600" fill="#14532d">记忆增强</text>
  <text x="470" y="362" text-anchor="middle" font-size="8" fill="#22c55e">Memory</text>
  <text x="470" y="374" text-anchor="middle" font-size="7" fill="#64748b">经验积累</text>
</svg>
