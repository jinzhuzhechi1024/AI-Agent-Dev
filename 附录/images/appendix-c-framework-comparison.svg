<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="Arial, sans-serif">
  <defs>
    <linearGradient id="bgC" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <filter id="shadowC">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-opacity="0.15"/>
    </filter>
  </defs>
  <rect width="560" height="420" fill="url(#bgC)" rx="8"/>
  <text x="280" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e293b">附录C · 主流框架能力矩阵对比</text>

  <!-- Table header -->
  <rect x="20" y="42" width="520" height="28" rx="4" fill="#1e293b"/>
  <text x="90" y="60" text-anchor="middle" font-size="10" fill="white" font-weight="bold">框架</text>
  <text x="190" y="60" text-anchor="middle" font-size="10" fill="white" font-weight="bold">编排模型</text>
  <text x="290" y="60" text-anchor="middle" font-size="10" fill="white" font-weight="bold">状态管理</text>
  <text x="390" y="60" text-anchor="middle" font-size="10" fill="white" font-weight="bold">MCP支持</text>
  <text x="490" y="60" text-anchor="middle" font-size="10" fill="white" font-weight="bold">A2A支持</text>

  <!-- LangGraph -->
  <rect x="20" y="72" width="520" height="32" rx="3" fill="#dbeafe" stroke="#3b82f6" stroke-width="1" filter="url(#shadowC)"/>
  <text x="90" y="92" text-anchor="middle" font-size="10" fill="#1e40af" font-weight="bold">LangGraph</text>
  <text x="190" y="92" text-anchor="middle" font-size="9" fill="#334155">StateGraph 图</text>
  <text x="290" y="92" text-anchor="middle" font-size="9" fill="#334155">Checkpoint 持久化</text>
  <text x="390" y="92" text-anchor="middle" font-size="9" fill="#22c55e" font-weight="bold">✓ 原生</text>
  <text x="490" y="92" text-anchor="middle" font-size="9" fill="#f59e0b">△ �适配</text>

  <!-- CrewAI -->
  <rect x="20" y="108" width="520" height="32" rx="3" fill="#dcfce7" stroke="#22c55e" stroke-width="1" filter="url(#shadowC)"/>
  <text x="90" y="128" text-anchor="middle" font-size="10" fill="#15803d" font-weight="bold">CrewAI</text>
  <text x="190" y="128" text-anchor="middle" font-size="9" fill="#334155">角色驱动 Crew</text>
  <text x="290" y="128" text-anchor="middle" font-size="9" fill="#334155">内存 + 任务状态</text>
  <text x="390" y="128" text-anchor="middle" font-size="9" fill="#22c55e" font-weight="bold">✓ 原生</text>
  <text x="490" y="128" text-anchor="middle" font-size="9" fill="#22c55e" font-weight="bold">✓ 原生</text>

  <!-- AutoGen -->
  <rect x="20" y="144" width="520" height="32" rx="3" fill="#fef3c7" stroke="#f59e0b" stroke-width="1" filter="url(#shadowC)"/>
  <text x="90" y="164" text-anchor="middle" font-size="10" fill="#b45309" font-weight="bold">AutoGen</text>
  <text x="190" y="164" text-anchor="middle" font-size="9" fill="#334155">对话 GroupChat</text>
  <text x="290" y="164" text-anchor="middle" font-size="9" fill="#334155">消息历史</text>
  <text x="390" y="164" text-anchor="middle" font-size="9" fill="#22c55e" font-weight="bold">✓ 原生</text>
  <text x="490" y="164" text-anchor="middle" font-size="9" fill="#f59e0b">△ �适配</text>

  <!-- OpenAI Agents SDK -->
  <rect x="20" y="180" width="520" height="32" rx="3" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1" filter="url(#shadowC)"/>
  <text x="90" y="200" text-anchor="middle" font-size="10" fill="#6d28d9" font-weight="bold">Agents SDK</text>
  <text x="190" y="200" text-anchor="middle" font-size="9" fill="#334155">Handoff 交接</text>
  <text x="290" y="200" text-anchor="middle" font-size="9" fill="#334155">Session + Context</text>
  <text x="390" y="200" text-anchor="middle" font-size="9" fill="#22c55e" font-weight="bold">✓ 原生</text>
  <text x="490" y="200" text-anchor="middle" font-size="9" fill="#ef4444">✗ 暂无</text>

  <!-- OpenClaw -->
  <rect x="20" y="216" width="520" height="32" rx="3" fill="#fee2e2" stroke="#ef4444" stroke-width="1" filter="url(#shadowC)"/>
  <text x="90" y="236" text-anchor="middle" font-size="10" fill="#991b1b" font-weight="bold">OpenClaw</text>
  <text x="190" y="236" text-anchor="middle" font-size="9" fill="#334155">Loop + Sub-Agent</text>
  <text x="290" y="236" text-anchor="middle" font-size="9" fill="#334155">Context Firewall</text>
  <text x="390" y="236" text-anchor="middle" font-size="9" fill="#22c55e" font-weight="bold">✓ 原生</text>
  <text x="490" y="236" text-anchor="middle" font-size="9" fill="#f59e0b">△ 需适配</text>

  <!-- Hermes Agent -->
  <rect x="20" y="252" width="520" height="32" rx="3" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1" filter="url(#shadowC)"/>
  <text x="90" y="272" text-anchor="middle" font-size="10" fill="#075985" font-weight="bold">Hermes Agent</text>
  <text x="190" y="272" text-anchor="middle" font-size="9" fill="#334155">自进化闭环</text>
  <text x="290" y="272" text-anchor="middle" font-size="9" fill="#334155">三层记忆</text>
  <text x="390" y="272" text-anchor="middle" font-size="9" fill="#22c55e" font-weight="bold">✓ 原生</text>
  <text x="490" y="272" text-anchor="middle" font-size="9" fill="#f59e0b">△ 需适配</text>

  <!-- Codex CLI -->
  <rect x="20" y="288" width="520" height="32" rx="3" fill="#f1f5f9" stroke="#64748b" stroke-width="1" filter="url(#shadowC)"/>
  <text x="90" y="308" text-anchor="middle" font-size="10" fill="#334155" font-weight="bold">Codex CLI</text>
  <text x="190" y="308" text-anchor="middle" font-size="9" fill="#334155">Harness 工程</text>
  <text x="290" y="308" text-anchor="middle" font-size="9" fill="#334155">沙箱隔离</text>
  <text x="390" y="308" text-anchor="middle" font-size="9" fill="#22c55e" font-weight="bold">✓ 原生</text>
  <text x="490" y="308" text-anchor="middle" font-size="9" fill="#ef4444">✗ 暂无</text>

  <!-- Protocol comparison -->
  <rect x="20" y="332" width="520" height="30" rx="4" fill="#1e293b"/>
  <text x="280" y="352" text-anchor="middle" font-size="11" fill="white" font-weight="bold">协议层对比</text>

  <rect x="20" y="364" width="250" height="44" rx="4" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5" filter="url(#shadowC)"/>
  <text x="145" y="380" text-anchor="middle" font-size="10" fill="#6d28d9" font-weight="bold">MCP (Agent ↔ Tools)</text>
  <text x="145" y="396" text-anchor="middle" font-size="9" fill="#475569">JSON-RPC · stdio/HTTP · 无状态(2026.07)</text>

  <rect x="290" y="364" width="250" height="44" rx="4" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5" filter="url(#shadowC)"/>
  <text x="415" y="380" text-anchor="middle" font-size="10" fill="#1e40af" font-weight="bold">A2A (Agent ↔ Agent)</text>
  <text x="415" y="396" text-anchor="middle" font-size="9" fill="#475569">JSON-RPC · HTTP/SSE · Agent Card 发现</text>
</svg>
