<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="Arial, sans-serif">
  <defs>
    <linearGradient id="bgD" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <filter id="shadowD">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-opacity="0.15"/>
    </filter>
  </defs>
  <rect width="560" height="420" fill="url(#bgD)" rx="8"/>
  <text x="280" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e293b">附录D · Agent 评估基准与方法论</text>

  <!-- Top: Benchmark categories -->
  <text x="280" y="50" text-anchor="middle" font-size="12" font-weight="bold" fill="#334155">四大评估维度</text>

  <!-- Four quadrants -->
  <rect x="20" y="62" width="260" height="100" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5" filter="url(#shadowD)"/>
  <text x="150" y="82" text-anchor="middle" font-size="11" fill="#1e40af" font-weight="bold">① 任务完成度</text>
  <text x="30" y="100" font-size="9" fill="#475569">SWE-bench: 真实GitHub Issue修复</text>
  <text x="30" y="114" font-size="9" fill="#475569">GAIA: 通用AI助手基准 (465题)</text>
  <text x="30" y="128" font-size="9" fill="#475569">AgentBench: 8类任务端到端</text>
  <text x="30" y="142" font-size="9" fill="#475569">τ-bench: 工具调用+多轮对话</text>
  <text x="30" y="156" font-size="9" fill="#64748b" font-style="italic">关注：成功率 / 部分完成 / 效率</text>

  <rect x="290" y="62" width="260" height="100" rx="8" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5" filter="url(#shadowD)"/>
  <text x="420" y="82" text-anchor="middle" font-size="11" fill="#15803d" font-weight="bold">② 工具使用能力</text>
  <text x="300" y="100" font-size="9" fill="#475569">BFCL (Berkeley Function Calling)</text>
  <text x="300" y="114" font-size="9" fill="#475569">ToolBench: 16K+ API 调用</text>
  <text x="300" y="128" font-size="9" fill="#475569">API-Bank: 三级递进工具选择</text>
  <text x="300" y="142" font-size="9" fill="#475569">Nexus: 多工具组合推理</text>
  <text x="300" y="156" font-size="9" fill="#64748b" font-style="italic">关注：选对工具 / 参数准确 / 组合</text>

  <rect x="20" y="172" width="260" height="100" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5" filter="url(#shadowD)"/>
  <text x="150" y="192" text-anchor="middle" font-size="11" fill="#b45309" font-weight="bold">③ 安全与稳健性</text>
  <text x="30" y="210" font-size="9" fill="#475569">RAGTruth: RAG 幻觉检测</text>
  <text x="30" y="224" font-size="9" fill="#475569">InjecAgent: Prompt 注入攻击</text>
  <text x="30" y="238" font-size="9" fill="#475569">AgentHarm: 有害指令拒绝率</text>
  <text x="30" y="252" font-size="9" fill="#475569">TrustAgent: 安全护栏有效性</text>
  <text x="30" y="266" font-size="9" fill="#64748b" font-style="italic">关注：幻觉率 / 越权 / 注入防御</text>

  <rect x="290" y="172" width="260" height="100" rx="8" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5" filter="url(#shadowD)"/>
  <text x="420" y="192" text-anchor="middle" font-size="11" fill="#991b1b" font-weight="bold">④ 多Agent协作</text>
  <text x="300" y="210" font-size="9" fill="#475569">CollabBench: 多Agent分工效率</text>
  <text x="300" y="224" font-size="9" fill="#475569">AgenticWork: 并行Agent MTTR</text>
  <text x="300" y="238" font-size="9" fill="#475569">MASLAB: 多Agent系统评估</text>
  <text x="300" y="252" font-size="9" fill="#475569">GaRAGe: RAG 基础幻觉基准</text>
  <text x="300" y="266" font-size="9" fill="#64748b" font-style="italic">关注：通信开销 / 协作增益 / 冲突</text>

  <!-- Evaluation pipeline -->
  <text x="280" y="294" text-anchor="middle" font-size="12" font-weight="bold" fill="#334155">评估方法论流程</text>

  <rect x="20" y="306" width="100" height="36" rx="6" fill="#1e293b" filter="url(#shadowD)"/>
  <text x="70" y="322" text-anchor="middle" font-size="9" fill="white" font-weight="bold">构建测试集</text>
  <text x="70" y="336" text-anchor="middle" font-size="8" fill="#94a3b8">人工+合成</text>

  <line x1="120" y1="324" x2="136" y2="324" stroke="#64748b" stroke-width="1.5"/>
  <polygon points="136,324 130,320 130,328" fill="#64748b"/>

  <rect x="140" y="306" width="100" height="36" rx="6" fill="#3b82f6" filter="url(#shadowD)"/>
  <text x="190" y="322" text-anchor="middle" font-size="9" fill="white" font-weight="bold">运行 Agent</text>
  <text x="190" y="336" text-anchor="middle" font-size="8" fill="#bfdbfe">记录Trace</text>

  <line x1="240" y1="324" x2="256" y2="324" stroke="#64748b" stroke-width="1.5"/>
  <polygon points="256,324 250,320 250,328" fill="#64748b"/>

  <rect x="260" y="306" width="100" height="36" rx="6" fill="#22c55e" filter="url(#shadowD)"/>
  <text x="310" y="322" text-anchor="middle" font-size="9" fill="white" font-weight="bold">LLM-as-Judge</text>
  <text x="310" y="336" text-anchor="middle" font-size="8" fill="#bbf7d0">校准+人工抽检</text>

  <line x1="360" y1="324" x2="376" y2="324" stroke="#64748b" stroke-width="1.5"/>
  <polygon points="376,324 370,320 370,328" fill="#64748b"/>

  <rect x="380" y="306" width="100" height="36" rx="6" fill="#f59e0b" filter="url(#shadowD)"/>
  <text x="430" y="322" text-anchor="middle" font-size="9" fill="white" font-weight="bold">指标聚合</text>
  <text x="430" y="336" text-anchor="middle" font-size="8" fill="#fef3c7">成功率+成本</text>

  <line x1="480" y1="324" x2="496" y2="324" stroke="#64748b" stroke-width="1.5"/>
  <polygon points="496,324 490,320 490,328" fill="#64748b"/>

  <rect x="500" y="306" width="50" height="36" rx="6" fill="#ef4444" filter="url(#shadowD)"/>
  <text x="525" y="322" text-anchor="middle" font-size="9" fill="white" font-weight="bold">回归</text>
  <text x="525" y="336" text-anchor="middle" font-size="8" fill="#fecaca">CI/CD</text>

  <!-- LLM-as-Judge detail -->
  <rect x="20" y="356" width="520" height="56" rx="6" fill="#1e293b"/>
  <text x="30" y="374" font-size="10" fill="#e2e8f0" font-weight="bold">LLM-as-Judge 校准三步法：</text>
  <text x="30" y="388" font-size="9" fill="#94a3b8">1. 人工标注 100+ 样本作为黄金集 → 2. LLM 评分与人工评分计算 Cohen's κ (≥0.7) → 3. 不达标则优化 Judge Prompt 或切换模型</text>
  <text x="30" y="402" font-size="9" fill="#64748b">来源：LangSmith Eval / Langfuse / SWE-bench / GAIA / BFCL / RAGTruth 2024-2026</text>
</svg>
