<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="Arial, sans-serif">
  <defs>
    <linearGradient id="bgB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <filter id="shadowB">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-opacity="0.15"/>
    </filter>
  </defs>
  <rect width="560" height="420" fill="url(#bgB)" rx="8"/>
  <text x="280" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e293b">附录B · Agent 设计模式选择决策树</text>

  <!-- Root -->
  <rect x="200" y="42" width="160" height="34" rx="17" fill="#3b82f6" filter="url(#shadowB)"/>
  <text x="280" y="64" text-anchor="middle" font-size="12" font-weight="bold" fill="white">Agent 任务特征？</text>

  <!-- Q1: Single or Multi agent? -->
  <line x1="280" y1="76" x2="280" y2="92" stroke="#64748b" stroke-width="1.5"/>
  <polygon points="280,92 272,98 288,98" fill="#64748b"/>
  <text x="290" y="90" font-size="9" fill="#64748b">任务可由单Agent完成？</text>

  <line x1="280" y1="98" x2="140" y2="98" stroke="#64748b" stroke-width="1.5"/>
  <line x1="280" y1="98" x2="420" y2="98" stroke="#64748b" stroke-width="1.5"/>
  <line x1="140" y1="98" x2="140" y2="112" stroke="#64748b" stroke-width="1.5"/>
  <line x1="420" y1="98" x2="420" y2="112" stroke="#64748b" stroke-width="1.5"/>
  <text x="190" y="94" font-size="9" fill="#22c55e" font-weight="bold">是 → 单Agent</text>
  <text x="345" y="94" font-size="9" fill="#ef4444" font-weight="bold">否 → 多Agent</text>

  <!-- Single Agent branch -->
  <rect x="60" y="112" width="160" height="30" rx="6" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5" filter="url(#shadowB)"/>
  <text x="140" y="132" text-anchor="middle" font-size="11" fill="#15803d" font-weight="bold">单 Agent 路线</text>

  <line x1="140" y1="142" x2="140" y2="156" stroke="#64748b" stroke-width="1.2"/>
  <text x="148" y="154" font-size="9" fill="#64748b">需要预先规划？</text>
  <line x1="140" y1="156" x2="80" y2="170" stroke="#64748b" stroke-width="1.2"/>
  <line x1="140" y1="156" x2="200" y2="170" stroke="#64748b" stroke-width="1.2"/>

  <rect x="20" y="170" width="120" height="28" rx="5" fill="#f0fdf4" stroke="#4ade80" stroke-width="1"/>
  <text x="80" y="188" text-anchor="middle" font-size="10" fill="#15803d">ReAct 循环模式</text>
  <rect x="150" y="170" width="120" height="28" rx="5" fill="#f0fdf4" stroke="#4ade80" stroke-width="1"/>
  <text x="210" y="188" text-anchor="middle" font-size="10" fill="#15803d">Plan-Execute 模式</text>

  <line x1="80" y1="198" x2="80" y2="210" stroke="#64748b" stroke-width="1"/>
  <text x="86" y="208" font-size="8" fill="#64748b">需工具调用？</text>
  <line x1="80" y1="210" x2="50" y2="222" stroke="#64748b" stroke-width="1"/>
  <line x1="80" y1="210" x2="110" y2="222" stroke="#64748b" stroke-width="1"/>
  <rect x="20" y="222" width="60" height="22" rx="4" fill="#f0fdf4" stroke="#4ade80"/>
  <text x="50" y="237" text-anchor="middle" font-size="9" fill="#15803d">ReAct+Tool</text>
  <rect x="90" y="222" width="60" height="22" rx="4" fill="#f0fdf4" stroke="#4ade80"/>
  <text x="120" y="237" text-anchor="middle" font-size="9" fill="#15803d">ReAct+RAG</text>

  <line x1="210" y1="198" x2="210" y2="210" stroke="#64748b" stroke-width="1"/>
  <text x="216" y="208" font-size="8" fill="#64748b">需自我验证？</text>
  <line x1="210" y1="210" x2="180" y2="222" stroke="#64748b" stroke-width="1"/>
  <line x1="210" y1="210" x2="240" y2="222" stroke="#64748b" stroke-width="1"/>
  <rect x="150" y="222" width="60" height="22" rx="4" fill="#f0fdf4" stroke="#4ade80"/>
  <text x="180" y="237" text-anchor="middle" font-size="9" fill="#15803d">Plan-Execute</text>
  <rect x="220" y="222" width="70" height="22" rx="4" fill="#f0fdf4" stroke="#4ade80"/>
  <text x="255" y="237" text-anchor="middle" font-size="9" fill="#15803d">Reflexion</text>

  <!-- Multi Agent branch -->
  <rect x="340" y="112" width="160" height="30" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5" filter="url(#shadowB)"/>
  <text x="420" y="132" text-anchor="middle" font-size="11" fill="#b45309" font-weight="bold">多 Agent 路线</text>

  <line x1="420" y1="142" x2="420" y2="156" stroke="#64748b" stroke-width="1.2"/>
  <text x="428" y="154" font-size="9" fill="#64748b">协作模式？</text>
  <line x1="420" y1="156" x2="360" y2="170" stroke="#64748b" stroke-width="1.2"/>
  <line x1="420" y1="156" x2="480" y2="170" stroke="#64748b" stroke-width="1.2"/>

  <rect x="300" y="170" width="120" height="28" rx="5" fill="#fffbeb" stroke="#fbbf24" stroke-width="1"/>
  <text x="360" y="188" text-anchor="middle" font-size="10" fill="#b45309">流水线 Pipeline</text>
  <rect x="420" y="170" width="120" height="28" rx="5" fill="#fffbeb" stroke="#fbbf24" stroke-width="1"/>
  <text x="480" y="188" text-anchor="middle" font-size="10" fill="#b45309">Orchestrator</text>

  <line x1="360" y1="198" x2="360" y2="210" stroke="#64748b" stroke-width="1"/>
  <text x="366" y="208" font-size="8" fill="#64748b">阶段固定？</text>
  <line x1="360" y1="210" x2="330" y2="222" stroke="#64748b" stroke-width="1"/>
  <line x1="360" y1="210" x2="390" y2="222" stroke="#64748b" stroke-width="1"/>
  <rect x="300" y="222" width="60" height="22" rx="4" fill="#fffbeb" stroke="#fbbf24"/>
  <text x="330" y="237" text-anchor="middle" font-size="9" fill="#b45309">Sequential</text>
  <rect x="370" y="222" width="60" height="22" rx="4" fill="#fffbeb" stroke="#fbbf24"/>
  <text x="400" y="237" text-anchor="middle" font-size="9" fill="#b45309">Parallel</text>

  <line x1="480" y1="198" x2="480" y2="210" stroke="#64748b" stroke-width="1"/>
  <text x="486" y="208" font-size="8" fill="#64748b">需中心调度？</text>
  <line x1="480" y1="210" x2="450" y2="222" stroke="#64748b" stroke-width="1"/>
  <line x1="480" y1="210" x2="520" y2="222" stroke="#64748b" stroke-width="1"/>
  <rect x="420" y="222" width="60" height="22" rx="4" fill="#fffbeb" stroke="#fbbf24"/>
  <text x="450" y="237" text-anchor="middle" font-size="9" fill="#b45309">Hub-Spoke</text>
  <rect x="490" y="222" width="60" height="22" rx="4" fill="#fffbeb" stroke="#fbbf24"/>
  <text x="520" y="237" text-anchor="middle" font-size="9" fill="#b45309">P2P Mesh</text>

  <!-- Safety patterns -->
  <rect x="60" y="270" width="440" height="30" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5" filter="url(#shadowB)"/>
  <text x="280" y="290" text-anchor="middle" font-size="11" fill="#991b1b" font-weight="bold">横切安全模式（适用于所有路线）</text>

  <line x1="280" y1="300" x2="280" y2="314" stroke="#64748b" stroke-width="1.2"/>

  <rect x="40" y="314" width="90" height="24" rx="4" fill="#fef2f2" stroke="#f87171"/>
  <text x="85" y="330" text-anchor="middle" font-size="9" fill="#991b1b">Guardrails</text>
  <rect x="140" y="314" width="90" height="24" rx="4" fill="#fef2f2" stroke="#f87171"/>
  <text x="185" y="330" text-anchor="middle" font-size="9" fill="#991b1b">HITL 审批</text>
  <rect x="240" y="314" width="90" height="24" rx="4" fill="#fef2f2" stroke="#f87171"/>
  <text x="285" y="330" text-anchor="middle" font-size="9" fill="#991b1b">沙箱隔离</text>
  <rect x="340" y="314" width="90" height="24" rx="4" fill="#fef2f2" stroke="#f87171"/>
  <text x="385" y="330" text-anchor="middle" font-size="9" fill="#991b1b">预算上限</text>
  <rect x="440" y="314" width="90" height="24" rx="4" fill="#fef2f2" stroke="#f87171"/>
  <text x="485" y="330" text-anchor="middle" font-size="9" fill="#991b1b">回滚机制</text>

  <!-- Bottom note -->
  <rect x="20" y="354" width="520" height="56" rx="4" fill="#1e293b"/>
  <text x="30" y="372" font-size="9" fill="#cbd5e1">决策路径：任务特征 → 单/多Agent → 流程模式 → 安全增强</text>
  <text x="30" y="386" font-size="9" fill="#cbd5e1">核心原则：先用最简单模式（ReAct），复杂度不够时再升级；安全模式不可选，必须叠加</text>
  <text x="30" y="400" font-size="9" fill="#94a3b8">详见：第14章模式总览 / 第15章流程控制 / 第16章交互协作与安全 / 第17章多Agent架构</text>
</svg>
