<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" width="560" height="400">
  <defs>
    <style>
      text { font-family: system-ui, -apple-system, sans-serif; }
    </style>
    <marker id="lf" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#888888"/></marker>
  </defs>
  <rect width="560" height="400" fill="#F5F5F5" rx="12"/>

  <text x="280" y="24" text-anchor="middle" font-size="15" font-weight="bold" fill="#333333">A2A Task 生命周期</text>
  <text x="280" y="40" text-anchor="middle" font-size="10" fill="#888888">submitted → working → input-required → completed / failed / cancelled</text>

  <!-- submitted -->
  <rect x="30" y="65" width="110" height="40" fill="#E3F2FD" stroke="#42A5F5" stroke-width="1.5" rx="8"/>
  <text x="85" y="82" text-anchor="middle" font-size="10" font-weight="bold" fill="#1565C0">submitted</text>
  <text x="85" y="96" text-anchor="middle" font-size="8" fill="#666666">任务已提交</text>

  <!-- arrow -->
  <line x1="140" y1="85" x2="170" y2="85" stroke="#888888" stroke-width="1.5" marker-end="url(#lf)"/>

  <!-- working -->
  <rect x="170" y="65" width="110" height="40" fill="#E8F5E9" stroke="#81C784" stroke-width="1.5" rx="8"/>
  <text x="225" y="82" text-anchor="middle" font-size="10" font-weight="bold" fill="#2E7D32">working</text>
  <text x="225" y="96" text-anchor="middle" font-size="8" fill="#666666">Agent 执行中</text>

  <!-- arrow right -->
  <line x1="280" y1="85" x2="310" y2="85" stroke="#888888" stroke-width="1.5" marker-end="url(#lf)"/>

  <!-- input-required -->
  <rect x="310" y="65" width="115" height="40" fill="#FFF3E0" stroke="#FFB74D" stroke-width="1.5" rx="8"/>
  <text x="367" y="82" text-anchor="middle" font-size="9" font-weight="bold" fill="#E65100">input-required</text>
  <text x="367" y="96" text-anchor="middle" font-size="8" fill="#666666">需更多输入</text>

  <!-- arrow right to completed -->
  <line x1="425" y1="85" x2="455" y2="85" stroke="#888888" stroke-width="1.5" marker-end="url(#lf)"/>

  <!-- completed -->
  <rect x="455" y="65" width="100" height="40" fill="#C8E6C9" stroke="#66BB6A" stroke-width="1.5" rx="8"/>
  <text x="505" y="82" text-anchor="middle" font-size="10" font-weight="bold" fill="#2E7D32">completed</text>
  <text x="505" y="96" text-anchor="middle" font-size="8" fill="#666666">返回 Artifact</text>

  <!-- Loop back from input-required to working -->
  <path d="M 367 105 Q 367 135 290 135 Q 225 135 225 105" fill="none" stroke="#FFB74D" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#lf)"/>
  <text x="296" y="128" text-anchor="middle" font-size="7" fill="#E65100">补充输入后恢复</text>

  <!-- failed -->
  <rect x="170" y="160" width="100" height="35" fill="#FFCDD2" stroke="#EF9A9A" stroke-width="1.5" rx="8"/>
  <text x="220" y="177" text-anchor="middle" font-size="10" font-weight="bold" fill="#C62828">failed</text>
  <text x="220" y="189" text-anchor="middle" font-size="8" fill="#666666">执行失败</text>

  <!-- cancelled -->
  <rect x="310" y="160" width="100" height="35" fill="#F5F5F5" stroke="#BDBDBD" stroke-width="1.5" rx="8"/>
  <text x="360" y="177" text-anchor="middle" font-size="10" font-weight="bold" fill="#757575">cancelled</text>
  <text x="360" y="189" text-anchor="middle" font-size="8" fill="#999999">被取消</text>

  <!-- Lines from working to failed/cancelled -->
  <line x1="200" y1="105" x2="200" y2="160" stroke="#EF9A9A" stroke-width="1" stroke-dasharray="3,2" marker-end="url(#lf)"/>
  <line x1="250" y1="105" x2="350" y2="160" stroke="#BDBDBD" stroke-width="1" stroke-dasharray="3,2" marker-end="url(#lf)"/>
  <text x="180" y="135" font-size="7" fill="#C62828">异常</text>
  <text x="330" y="135" font-size="7" fill="#757575">用户取消</text>

  <!-- Bottom: Communication flow -->
  <rect x="25" y="220" width="510" height="165" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="1" rx="8"/>
  <text x="280" y="240" text-anchor="middle" font-size="11" font-weight="bold" fill="#333333">A2A 通信流程实战</text>

  <!-- Step 1: Discovery -->
  <rect x="35" y="255" width="150" height="55" fill="#E3F2FD" stroke="#90CAF9" stroke-width="1" rx="6"/>
  <text x="110" y="272" text-anchor="middle" font-size="9" font-weight="bold" fill="#1565C0">1. Agent 发现</text>
  <text x="110" y="287" text-anchor="middle" font-size="7" fill="#666666">GET /.well-known/</text>
  <text x="110" y="299" text-anchor="middle" font-size="7" fill="#666666">agent-card.json</text>

  <!-- Step 2: Task create -->
  <rect x="205" y="255" width="150" height="55" fill="#E8F5E9" stroke="#A5D6A7" stroke-width="1" rx="6"/>
  <text x="280" y="272" text-anchor="middle" font-size="9" font-weight="bold" fill="#2E7D32">2. 任务创建</text>
  <text x="280" y="287" text-anchor="middle" font-size="7" fill="#666666">POST /tasks/send</text>
  <text x="280" y="299" text-anchor="middle" font-size="7" fill="#666666">→ submitted</text>

  <!-- Step 3: Poll/Stream -->
  <rect x="375" y="255" width="150" height="55" fill="#FFF3E0" stroke="#FFCC80" stroke-width="1" rx="6"/>
  <text x="450" y="272" text-anchor="middle" font-size="9" font-weight="bold" fill="#E65100">3. 状态查询</text>
  <text x="450" y="287" text-anchor="middle" font-size="7" fill="#666666">GET /tasks/{id}</text>
  <text x="450" y="299" text-anchor="middle" font-size="7" fill="#666666">或 SSE 流式订阅</text>

  <!-- Arrows between -->
  <line x1="185" y1="282" x2="205" y2="282" stroke="#888888" stroke-width="1" marker-end="url(#lf)"/>
  <line x1="355" y1="282" x2="375" y2="282" stroke="#888888" stroke-width="1" marker-end="url(#lf)"/>

  <!-- Result -->
  <rect x="120" y="325" width="320" height="45" fill="#C8E6C9" stroke="#66BB6A" stroke-width="1" rx="6"/>
  <text x="280" y="342" text-anchor="middle" font-size="9" font-weight="bold" fill="#2E7D32">4. 任务完成 → 返回 Artifact</text>
  <text x="280" y="358" text-anchor="middle" font-size="7" fill="#666666">Artifact = {name, description, parts: [文本/文件/结构化数据]}</text>
</svg>
