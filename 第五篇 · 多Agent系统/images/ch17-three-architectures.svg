<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" width="560" height="400">
  <defs>
    <style>
      text { font-family: system-ui, -apple-system, sans-serif; }
    </style>
    <marker id="a1" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="#888888"/></marker>
  </defs>
  <rect width="560" height="400" fill="#F5F5F5" rx="12"/>

  <text x="280" y="24" text-anchor="middle" font-size="15" font-weight="bold" fill="#333333">三大多 Agent 架构模式</text>
  <text x="280" y="40" text-anchor="middle" font-size="10" fill="#888888">Supervisor · Network · Hierarchical</text>

  <!-- Architecture 1: Supervisor -->
  <rect x="20" y="55" width="170" height="325" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="1" rx="8"/>
  <rect x="20" y="55" width="170" height="22" fill="#1976D2" rx="8"/>
  <text x="105" y="70" text-anchor="middle" font-size="10" font-weight="bold" fill="#FFFFFF">Supervisor 架构</text>
  <text x="105" y="88" text-anchor="middle" font-size="8" fill="#888888">中央调度模式</text>

  <!-- Supervisor center -->
  <circle cx="105" cy="125" r="22" fill="#1976D2"/>
  <text x="105" y="122" text-anchor="middle" font-size="8" font-weight="bold" fill="#FFFFFF">Supervisor</text>
  <text x="105" y="133" text-anchor="middle" font-size="7" fill="#FFFFFF">协调者</text>

  <!-- Workers -->
  <rect x="35" y="165" width="60" height="30" fill="#E3F2FD" stroke="#90CAF9" stroke-width="1" rx="4"/>
  <text x="65" y="184" text-anchor="middle" font-size="8" fill="#1565C0">Agent A</text>
  <rect x="115" y="165" width="60" height="30" fill="#E3F2FD" stroke="#90CAF9" stroke-width="1" rx="4"/>
  <text x="145" y="184" text-anchor="middle" font-size="8" fill="#1565C0">Agent B</text>
  <rect x="35" y="210" width="60" height="30" fill="#E3F2FD" stroke="#90CAF9" stroke-width="1" rx="4"/>
  <text x="65" y="229" text-anchor="middle" font-size="8" fill="#1565C0">Agent C</text>
  <rect x="115" y="210" width="60" height="30" fill="#E3F2FD" stroke="#90CAF9" stroke-width="1" rx="4"/>
  <text x="145" y="229" text-anchor="middle" font-size="8" fill="#1565C0">Agent D</text>

  <!-- Lines -->
  <line x1="95" y1="145" x2="65" y2="165" stroke="#90CAF9" stroke-width="1"/>
  <line x1="115" y1="145" x2="145" y2="165" stroke="#90CAF9" stroke-width="1"/>
  <line x1="95" y1="145" x2="65" y2="210" stroke="#90CAF9" stroke-width="1"/>
  <line x1="115" y1="145" x2="145" y2="210" stroke="#90CAF9" stroke-width="1"/>

  <text x="105" y="265" text-anchor="middle" font-size="8" fill="#666666" font-weight="bold">特点</text>
  <g font-size="8" fill="#999999">
    <text x="28" y="280">▪ 中央统一调度</text>
    <text x="28" y="293">▪ 清晰的职责分配</text>
    <text x="28" y="306">▪ 易调试·可预测</text>
    <text x="28" y="319">▪ 中心瓶颈风险</text>
  </g>
  <text x="105" y="345" text-anchor="middle" font-size="8" fill="#1976D2" font-style="italic">适合：流程明确</text>
  <text x="105" y="358" text-anchor="middle" font-size="8" fill="#1976D2" font-style="italic">任务可预分解</text>
  <text x="105" y="372" text-anchor="middle" font-size="8" fill="#1976D2" font-weight="bold">LangGraph Supervisor</text>

  <!-- Architecture 2: Network -->
  <rect x="195" y="55" width="170" height="325" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="1" rx="8"/>
  <rect x="195" y="55" width="170" height="22" fill="#00897B" rx="8"/>
  <text x="280" y="70" text-anchor="middle" font-size="10" font-weight="bold" fill="#FFFFFF">Network 架构</text>
  <text x="280" y="88" text-anchor="middle" font-size="8" fill="#888888">对等协作模式</text>

  <!-- Network nodes -->
  <circle cx="280" cy="120" r="18" fill="#00897B"/>
  <text x="280" y="124" text-anchor="middle" font-size="7" font-weight="bold" fill="#FFFFFF">Agent A</text>

  <circle cx="230" cy="170" r="18" fill="#00897B"/>
  <text x="230" y="174" text-anchor="middle" font-size="7" font-weight="bold" fill="#FFFFFF">Agent B</text>

  <circle cx="330" cy="170" r="18" fill="#00897B"/>
  <text x="330" y="174" text-anchor="middle" font-size="7" font-weight="bold" fill="#FFFFFF">Agent C</text>

  <circle cx="230" cy="225" r="18" fill="#00897B"/>
  <text x="230" y="229" text-anchor="middle" font-size="7" font-weight="bold" fill="#FFFFFF">Agent D</text>

  <circle cx="330" cy="225" r="18" fill="#00897B"/>
  <text x="330" y="229" text-anchor="middle" font-size="7" font-weight="bold" fill="#FFFFFF">Agent E</text>

  <!-- P2P lines -->
  <line x1="268" y1="135" x2="242" y2="155" stroke="#80CBC4" stroke-width="1"/>
  <line x1="292" y1="135" x2="318" y2="155" stroke="#80CBC4" stroke-width="1"/>
  <line x1="242" y1="185" x2="268" y2="210" stroke="#80CBC4" stroke-width="1"/>
  <line x1="318" y1="185" x2="292" y2="210" stroke="#80CBC4" stroke-width="1"/>
  <line x1="242" y1="185" x2="318" y2="185" stroke="#80CBC4" stroke-width="1"/>
  <line x1="242" y1="210" x2="318" y2="210" stroke="#80CBC4" stroke-width="1"/>
  <line x1="230" y1="188" x2="230" y2="207" stroke="#80CBC4" stroke-width="1"/>
  <line x1="330" y1="188" x2="330" y2="207" stroke="#80CBC4" stroke-width="1"/>

  <text x="280" y="265" text-anchor="middle" font-size="8" fill="#666666" font-weight="bold">特点</text>
  <g font-size="8" fill="#999999">
    <text x="203" y="280">▪ 无中心节点</text>
    <text x="203" y="293">▪ 灵活·自适应</text>
    <text x="203" y="306">▪ 高可用·无单点</text>
    <text x="203" y="319">▪ 协调复杂·难调试</text>
  </g>
  <text x="280" y="345" text-anchor="middle" font-size="8" fill="#00897B" font-style="italic">适合：探索性任务</text>
  <text x="280" y="358" text-anchor="middle" font-size="8" fill="#00897B" font-style="italic">创意·辩论场景</text>
  <text x="280" y="372" text-anchor="middle" font-size="8" fill="#00897B" font-weight="bold">CrewAI · AutoGen</text>

  <!-- Architecture 3: Hierarchical -->
  <rect x="370" y="55" width="170" height="325" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="1" rx="8"/>
  <rect x="370" y="55" width="170" height="22" fill="#E65100" rx="8"/>
  <text x="455" y="70" text-anchor="middle" font-size="10" font-weight="bold" fill="#FFFFFF">Hierarchical 架构</text>
  <text x="455" y="88" text-anchor="middle" font-size="8" fill="#888888">分层委派模式</text>

  <!-- Top level -->
  <rect x="415" y="105" width="80" height="28" fill="#E65100" rx="4"/>
  <text x="455" y="123" text-anchor="middle" font-size="8" font-weight="bold" fill="#FFFFFF">Top Agent</text>

  <!-- Mid level -->
  <rect x="380" y="160" width="65" height="26" fill="#FFF3E0" stroke="#FFCC80" stroke-width="1" rx="4"/>
  <text x="412" y="177" text-anchor="middle" font-size="7" fill="#E65100">Mid Agent 1</text>
  <rect x="465" y="160" width="65" height="26" fill="#FFF3E0" stroke="#FFCC80" stroke-width="1" rx="4"/>
  <text x="498" y="177" text-anchor="middle" font-size="7" fill="#E65100">Mid Agent 2</text>

  <!-- Bottom level -->
  <rect x="378" y="215" width="55" height="24" fill="#FFE0B2" stroke="#FFB74D" stroke-width="1" rx="4"/>
  <text x="406" y="231" text-anchor="middle" font-size="7" fill="#E65100">Worker A</text>
  <rect x="438" y="215" width="55" height="24" fill="#FFE0B2" stroke="#FFB74D" stroke-width="1" rx="4"/>
  <text x="466" y="231" text-anchor="middle" font-size="7" fill="#E65100">Worker B</text>
  <rect x="498" y="215" width="55" height="24" fill="#FFE0B2" stroke="#FFB74D" stroke-width="1" rx="4"/>
  <text x="526" y="231" text-anchor="middle" font-size="7" fill="#E65100">Worker C</text>
  <rect x="378" y="248" width="55" height="24" fill="#FFE0B2" stroke="#FFB74D" stroke-width="1" rx="4"/>
  <text x="406" y="264" text-anchor="middle" font-size="7" fill="#E65100">Worker D</text>
  <rect x="438" y="248" width="55" height="24" fill="#FFE0B2" stroke="#FFB74D" stroke-width="1" rx="4"/>
  <text x="466" y="264" text-anchor="middle" font-size="7" fill="#E65100">Worker E</text>

  <!-- Lines -->
  <line x1="440" y1="133" x2="412" y2="160" stroke="#FFCC80" stroke-width="1"/>
  <line x1="470" y1="133" x2="498" y2="160" stroke="#FFCC80" stroke-width="1"/>
  <line x1="395" y1="186" x2="406" y2="215" stroke="#FFCC80" stroke-width="1"/>
  <line x1="420" y1="186" x2="466" y2="215" stroke="#FFCC80" stroke-width="1"/>
  <line x1="498" y1="186" x2="526" y2="215" stroke="#FFCC80" stroke-width="1"/>
  <line x1="395" y1="186" x2="406" y2="248" stroke="#FFCC80" stroke-width="1"/>
  <line x1="420" y1="186" x2="466" y2="248" stroke="#FFCC80" stroke-width="1"/>

  <text x="455" y="295" text-anchor="middle" font-size="8" fill="#666666" font-weight="bold">特点</text>
  <g font-size="8" fill="#999999">
    <text x="378" y="310">▪ 分层委派</text>
    <text x="378" y="323">▪ 宏观+局部分工</text>
    <text x="378" y="336">▪ 可大规模扩展</text>
    <text x="378" y="349">▪ 设计复杂度高</text>
  </g>
  <text x="455" y="370" text-anchor="middle" font-size="8" fill="#E65100" font-style="italic">适合：大规模复杂任务</text>
  <text x="455" y="380" text-anchor="middle" font-size="8" fill="#E65100" font-weight="bold">MetaGPT · CrewAI</text>
</svg>
