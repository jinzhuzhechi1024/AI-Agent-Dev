<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" width="560" height="400">
  <defs>
    <style>
      text { font-family: system-ui, -apple-system, sans-serif; }
    </style>
    <marker id="cs" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="#888888"/></marker>
  </defs>
  <rect width="560" height="400" fill="#F5F5F5" rx="12"/>

  <text x="280" y="24" text-anchor="middle" font-size="15" font-weight="bold" fill="#333333">多 Agent 协作策略全景</text>
  <text x="280" y="40" text-anchor="middle" font-size="10" fill="#888888">任务分解 → 结果聚合 → 冲突处理 → 消息格式</text>

  <!-- Section 1: Task Decomposition -->
  <rect x="20" y="55" width="260" height="105" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="1" rx="8"/>
  <rect x="20" y="55" width="260" height="22" fill="#1976D2" rx="8"/>
  <text x="150" y="70" text-anchor="middle" font-size="10" font-weight="bold" fill="#FFFFFF">任务分解策略</text>

  <rect x="30" y="85" width="75" height="28" fill="#E3F2FD" stroke="#90CAF9" stroke-width="1" rx="4"/>
  <text x="67" y="100" text-anchor="middle" font-size="8" fill="#1565C0" font-weight="bold">按能力</text>
  <text x="67" y="110" text-anchor="middle" font-size="7" fill="#999">编码/测试/审查</text>

  <rect x="115" y="85" width="75" height="28" fill="#E3F2FD" stroke="#90CAF9" stroke-width="1" rx="4"/>
  <text x="152" y="100" text-anchor="middle" font-size="8" fill="#1565C0" font-weight="bold">按阶段</text>
  <text x="152" y="110" text-anchor="middle" font-size="7" fill="#999">设计/实现/部署</text>

  <rect x="200" y="85" width="70" height="28" fill="#E3F2FD" stroke="#90CAF9" stroke-width="1" rx="4"/>
  <text x="235" y="100" text-anchor="middle" font-size="8" fill="#1565C0" font-weight="bold">按领域</text>
  <text x="235" y="110" text-anchor="middle" font-size="7" fill="#999">前端/后端/QA</text>

  <text x="150" y="130" text-anchor="middle" font-size="8" fill="#666666">原则：子任务边界清晰、</text>
  <text x="150" y="143" text-anchor="middle" font-size="8" fill="#666666">最小化跨 Agent 依赖</text>
  <text x="150" y="155" text-anchor="middle" font-size="8" fill="#1976D2" font-style="italic">→ 并行度最大化</text>

  <!-- Section 2: Result Aggregation -->
  <rect x="290" y="55" width="250" height="105" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="1" rx="8"/>
  <rect x="290" y="55" width="250" height="22" fill="#00897B" rx="8"/>
  <text x="415" y="70" text-anchor="middle" font-size="10" font-weight="bold" fill="#FFFFFF">结果聚合策略</text>

  <rect x="300" y="85" width="72" height="28" fill="#E0F2F1" stroke="#80CBC4" stroke-width="1" rx="4"/>
  <text x="336" y="100" text-anchor="middle" font-size="8" fill="#00695C" font-weight="bold">投票</text>
  <text x="336" y="110" text-anchor="middle" font-size="7" fill="#999">多数决</text>

  <rect x="380" y="85" width="72" height="28" fill="#E0F2F1" stroke="#80CBC4" stroke-width="1" rx="4"/>
  <text x="416" y="100" text-anchor="middle" font-size="8" fill="#00695C" font-weight="bold">仲裁</text>
  <text x="416" y="110" text-anchor="middle" font-size="7" fill="#999">专家裁决</text>

  <rect x="460" y="85" width="72" height="28" fill="#E0F2F1" stroke="#80CBC4" stroke-width="1" rx="4"/>
  <text x="496" y="100" text-anchor="middle" font-size="8" fill="#00695C" font-weight="bold">级联</text>
  <text x="496" y="110" text-anchor="middle" font-size="7" fill="#999">流水线</text>

  <text x="415" y="130" text-anchor="middle" font-size="8" fill="#666666">投票：多 Agent 各出方案→选最佳</text>
  <text x="415" y="143" text-anchor="middle" font-size="8" fill="#666666">仲裁：冲突时由上级 Agent 裁决</text>
  <text x="415" y="155" text-anchor="middle" font-size="8" fill="#00897B" font-style="italic">→ 质量与速度的权衡</text>

  <!-- Section 3: Conflict Handling -->
  <rect x="20" y="175" width="260" height="100" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="1" rx="8"/>
  <rect x="20" y="175" width="260" height="22" fill="#E65100" rx="8"/>
  <text x="150" y="190" text-anchor="middle" font-size="10" font-weight="bold" fill="#FFFFFF">冲突处理</text>

  <g font-size="8" fill="#666666">
    <text x="30" y="210">▪ 资源竞争：两个 Agent 同时写同一文件</text>
    <text x="30" y="225">  → 锁机制 + 写入队列</text>
    <text x="30" y="240">▪ 结论矛盾：审查A说安全，审查B说有漏洞</text>
    <text x="30" y="255">  → 仲裁 Agent + 人工介入</text>
    <text x="30" y="268" fill="#E65100" font-style="italic">→ 优先级：人工 > 仲裁 > 投票</text>
  </g>

  <!-- Section 4: Message Format -->
  <rect x="290" y="175" width="250" height="100" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="1" rx="8"/>
  <rect x="290" y="175" width="250" height="22" fill="#7B1FA2" rx="8"/>
  <text x="415" y="190" text-anchor="middle" font-size="10" font-weight="bold" fill="#FFFFFF">消息格式</text>

  <g font-size="8" fill="#666666">
    <text x="300" y="210">▪ 结构化：JSON Schema（严格契约）</text>
    <text x="300" y="225">  → 可验证·版本控制·CI 测试</text>
    <text x="300" y="240">▪ 自然语言：灵活但需解析</text>
    <text x="300" y="255">  → 探索性任务·创意协作</text>
    <text x="300" y="268" fill="#7B1FA2" font-style="italic">→ 推荐：混合策略</text>
  </g>

  <!-- Bottom: Quality Multiplication -->
  <rect x="20" y="290" width="520" height="95" fill="#FFFFFF" stroke="#D32F2F" stroke-width="1.5" rx="8"/>
  <rect x="20" y="290" width="520" height="22" fill="#D32F2F" rx="8"/>
  <text x="280" y="305" text-anchor="middle" font-size="10" font-weight="bold" fill="#FFFFFF">⚠️ 质量乘法衰减：多 Agent 系统的隐藏陷阱</text>

  <text x="280" y="330" text-anchor="middle" font-size="10" fill="#333333" font-weight="bold">4 个各 90% 正确的 Agent 串联 → 端到端正确率 = 0.9⁴ ≈ 65.6%</text>
  <text x="280" y="348" text-anchor="middle" font-size="9" fill="#666666">单 Agent 评估各自通过（90%×85%×80%≠好），但端到端质量是乘法式衰减</text>
  <text x="280" y="365" text-anchor="middle" font-size="9" fill="#D32F2F" font-weight="bold">→ 必须建立端到端评估体系，而非仅做单 Agent 评估</text>
  <text x="280" y="378" text-anchor="middle" font-size="8" fill="#999999">交叉验证（辩论/投票/层级审查）可改善——微软实验数据表明多 Agent 讨论在推理基准上有可量化提升</text>
</svg>
