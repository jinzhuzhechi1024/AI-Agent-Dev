<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" width="560" height="400">
  <defs>
    <style>
      text { font-family: system-ui, -apple-system, sans-serif; }
    </style>
  </defs>
  <rect width="560" height="400" fill="#F5F5F5" rx="12"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#333333">三角色消息体系：关注点分离</text>
  <text x="280" y="42" text-anchor="middle" font-size="10" fill="#888888">System（人格）· User（输入）· Assistant（历史）</text>

  <!-- System role - top -->
  <rect x="140" y="60" width="280" height="70" fill="#E3F2FD" stroke="#42A5F5" stroke-width="1.5" rx="8"/>
  <rect x="140" y="60" width="280" height="22" fill="#1976D2" rx="8"/>
  <text x="280" y="75" text-anchor="middle" font-size="11" font-weight="bold" fill="#FFFFFF">System Prompt — 人格设定</text>
  <text x="150" y="98" font-size="9" fill="#1565C0">"你是代码审查专家。只关注安全和性能问题。"</text>
  <text x="150" y="112" font-size="9" fill="#1565C0">"输出格式：{问题类型, 严重程度, 描述, 修复建议}"</text>
  <text x="150" y="125" font-size="8" fill="#999999">稳定不变 · 权重最高 · 定义"是谁"</text>

  <!-- Down arrow -->
  <line x1="280" y1="135" x2="280" y2="155" stroke="#888888" stroke-width="1.5" marker-end="url(#ma)"/>
  <marker id="ma" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#888888"/></marker>

  <!-- User role - left -->
  <rect x="25" y="160" width="220" height="70" fill="#FFF3E0" stroke="#FFB74D" stroke-width="1.5" rx="8"/>
  <rect x="25" y="160" width="220" height="22" fill="#E65100" rx="8"/>
  <text x="135" y="175" text-anchor="middle" font-size="11" font-weight="bold" fill="#FFFFFF">User — 动态输入</text>
  <text x="35" y="198" font-size="9" fill="#E65100">"审查：def run_query(sql):"</text>
  <text x="35" y="212" font-size="9" fill="#E65100">"    cursor.execute(sql)"</text>
  <text x="35" y="225" font-size="8" fill="#999999">每次不同 · 任务描述</text>

  <!-- Right arrow to assistant -->
  <line x1="250" y1="195" x2="310" y2="195" stroke="#888888" stroke-width="1.5" marker-end="url(#mb)"/>
  <marker id="mb" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#888888"/></marker>

  <!-- Assistant role - right -->
  <rect x="315" y="160" width="220" height="70" fill="#E8F5E9" stroke="#81C784" stroke-width="1.5" rx="8"/>
  <rect x="315" y="160" width="220" height="22" fill="#2E7D32" rx="8"/>
  <text x="425" y="175" text-anchor="middle" font-size="11" font-weight="bold" fill="#FFFFFF">Assistant — 历史上下文</text>
  <text x="325" y="198" font-size="9" fill="#2E7D32">"{安全: SQL注入风险,</text>
  <text x="325" y="212" font-size="9" fill="#2E7D32"> 修复: 使用参数化查询}"</text>
  <text x="325" y="225" font-size="8" fill="#999999">模型回复 · 多轮记忆</text>

  <!-- Down arrow -->
  <line x1="280" y1="235" x2="280" y2="255" stroke="#888888" stroke-width="1.5" marker-end="url(#mc)"/>
  <marker id="mc" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#888888"/></marker>

  <!-- Bottom: new User input -->
  <rect x="140" y="260" width="280" height="55" fill="#FFF3E0" stroke="#FFB74D" stroke-width="1.5" rx="8"/>
  <rect x="140" y="260" width="280" height="20" fill="#E65100" rx="8"/>
  <text x="280" y="274" text-anchor="middle" font-size="10" font-weight="bold" fill="#FFFFFF">User — 新一轮输入</text>
  <text x="150" y="295" font-size="9" fill="#E65100">"再审查：def get_file(name):"</text>
  <text x="150" y="308" font-size="9" fill="#E65100">"    return open(name).read()"</text>

  <!-- Bottom annotation -->
  <rect x="25" y="335" width="510" height="50" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="1" rx="6"/>
  <text x="280" y="355" text-anchor="middle" font-size="10" font-weight="bold" fill="#333333">工程价值：关注点分离</text>
  <text x="280" y="372" text-anchor="middle" font-size="9" fill="#666666">System 定义稳定约束（不变）| User 是动态输入（变）| Assistant 是历史记录（累积）</text>
  <text x="280" y="385" text-anchor="middle" font-size="8" fill="#999999">把行为约束放 System 而非 User → 模型更稳定遵循规则（注意力机制权重更高）</text>
</svg>
