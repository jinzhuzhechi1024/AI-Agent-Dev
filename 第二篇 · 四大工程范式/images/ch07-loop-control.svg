<?xml version="1.0" encoding="UTF-8"?>
<svg width="560" height="400" xmlns="http://www.w3.org/2000/svg">
  <text x="280" y="25" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="bold" fill="#333333">循环控制工程：三层安全网</text>
  <rect x="25" y="45" width="150" height="38" rx="6" fill="#FFFFFF" stroke="#E76F00" stroke-width="2"/>
  <text x="100" y="69" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold" fill="#E76F00">终止条件</text>
  <text x="100" y="105" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#333333">任务完成信号</text>
  <text x="100" y="128" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#333333">最大迭代 N 次</text>
  <text x="100" y="151" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#333333">超时 T 秒退出</text>
  <text x="100" y="185" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#888888">何时停止循环</text>
  <rect x="205" y="45" width="150" height="38" rx="6" fill="#FFFFFF" stroke="#00ADD8" stroke-width="2"/>
  <text x="280" y="69" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold" fill="#00ADD8">循环检测</text>
  <text x="280" y="105" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#333333">状态指纹去重</text>
  <text x="280" y="128" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#333333">行为序列检测</text>
  <text x="280" y="151" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#333333">强制打破机制</text>
  <text x="280" y="185" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#888888">防止死循环</text>
  <rect x="385" y="45" width="150" height="38" rx="6" fill="#FFFFFF" stroke="#D32F2F" stroke-width="2"/>
  <text x="460" y="69" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold" fill="#D32F2F">资源约束</text>
  <text x="460" y="105" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#333333">Token 预算</text>
  <text x="460" y="128" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#333333">API 限流</text>
  <text x="460" y="151" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#333333">并发控制</text>
  <text x="460" y="185" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#888888">控制成本与风险</text>
  <line x1="30" y1="215" x2="530" y2="215" stroke="#DDDDDD" stroke-width="1"/>
  <rect x="180" y="235" width="200" height="45" rx="8" fill="#F5F5F5" stroke="#333333" stroke-width="2"/>
  <text x="280" y="263" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="#333333">Agent Loop</text>
  <line x1="100" y1="200" x2="200" y2="240" stroke="#E76F00" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="280" y1="200" x2="280" y2="235" stroke="#00ADD8" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="460" y1="200" x2="360" y2="240" stroke="#D32F2F" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="280" y="310" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#333333">三层防护 = 终止条件 × 循环检测 × 资源约束</text>
  <text x="280" y="335" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#666666">确保 Agent 循环：可控 · 可预测 · 可中止</text>
  <text x="280" y="370" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#999999">Yao et al., ICLR 2023 · Xu et al., 2023 · Zhou et al., NeurIPS 2023</text>
</svg>
