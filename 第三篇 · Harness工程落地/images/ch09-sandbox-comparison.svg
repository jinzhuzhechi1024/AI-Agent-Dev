<?xml version="1.0" encoding="UTF-8"?>
<svg width="560" height="400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="560" height="400" fill="#F5F5F5" rx="8" />

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" fill="#333333">沙箱方案对比</text>

  <!-- Cell 1: macOS Seatbelt (top-left) -->
  <rect x="15" y="45" width="260" height="28" fill="#00ADD8" rx="4" />
  <text x="145" y="64" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF">macOS Seatbelt</text>
  <rect x="15" y="73" width="260" height="132" fill="#FFFFFF" stroke="#00ADD8" stroke-width="1" rx="0 0 4 4" />
  <text x="30" y="95" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#333333">• 内核级沙箱 Sandbox.kext</text>
  <text x="30" y="116" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#333333">• SBPL配置(Scheme语法)</text>
  <text x="30" y="137" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#333333">• sandbox-exec命令</text>
  <text x="30" y="158" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#333333">• 2017 deprecated仍可用</text>
  <text x="30" y="179" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#333333">• Chrome/Claude/Cursor在用</text>
  <text x="30" y="197" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#888888">最后匹配规则生效(last-match-wins)</text>

  <!-- Cell 2: Linux Landlock (top-right) -->
  <rect x="290" y="45" width="260" height="28" fill="#E76F00" rx="4" />
  <text x="420" y="64" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF">Linux Landlock</text>
  <rect x="290" y="73" width="260" height="132" fill="#FFFFFF" stroke="#E76F00" stroke-width="1" rx="0 0 4 4" />
  <text x="305" y="95" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#333333">• Linux内核LSM模块</text>
  <text x="305" y="116" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#333333">• 无需root权限</text>
  <text x="305" y="137" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#333333">• 文件系统+网络控制</text>
  <text x="305" y="158" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#333333">• Linux 5.13+内置</text>
  <text x="305" y="179" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#333333">• 渐进式只增不减</text>
  <text x="305" y="197" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#888888">ABI v4起支持TCP网络规则</text>

  <!-- Cell 3: Docker (bottom-left) -->
  <rect x="15" y="220" width="260" height="28" fill="#333333" rx="4" />
  <text x="145" y="239" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF">Docker 容器隔离</text>
  <rect x="15" y="248" width="260" height="132" fill="#FFFFFF" stroke="#333333" stroke-width="1" rx="0 0 4 4" />
  <text x="30" y="270" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#333333">• namespace+cgroup隔离</text>
  <text x="30" y="291" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#333333">• --network none禁网</text>
  <text x="30" y="312" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#333333">• --read-only只读挂载</text>
  <text x="30" y="333" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#333333">• 生态成熟易部署</text>
  <text x="30" y="354" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#333333">• 适合CI/CD流水线</text>
  <text x="30" y="372" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#888888">Codex CLI Linux推荐方案</text>

  <!-- Cell 4: E2B Cloud (bottom-right) -->
  <rect x="290" y="220" width="260" height="28" fill="#D32F2F" rx="4" />
  <text x="420" y="239" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF">E2B 云沙箱</text>
  <rect x="290" y="248" width="260" height="132" fill="#FFFFFF" stroke="#D32F2F" stroke-width="1" rx="0 0 4 4" />
  <text x="305" y="270" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#333333">• Firecracker MicroVM</text>
  <text x="305" y="291" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#333333">• 150ms冷启动</text>
  <text x="305" y="312" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#333333">• Pause/Resume状态保持</text>
  <text x="305" y="333" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#333333">• 按秒计费~$0.05/h</text>
  <text x="305" y="354" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#333333">• Fortune100 88%在用</text>
  <text x="305" y="372" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#888888">Manus AI/Perplexity/HF</text>
</svg>
