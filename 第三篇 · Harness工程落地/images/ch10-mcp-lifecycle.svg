<?xml version="1.0" encoding="UTF-8"?>
<svg width="560" height="400" xmlns="http://www.w3.org/2000/svg">
  <rect width="560" height="400" fill="#F5F5F5" rx="8" />
  <text x="280" y="28" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" fill="#333333">MCP 连接生命周期</text>

  <!-- Phase 1: Initialize -->
  <rect x="40" y="55" width="180" height="100" fill="#FFFFFF" stroke="#00ADD8" stroke-width="2" rx="8" />
  <rect x="40" y="55" width="180" height="24" fill="#00ADD8" rx="8" />
  <text x="130" y="73" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF">1. Initialize</text>
  <text x="55" y="98" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#333333">Client 发送 initialize</text>
  <text x="55" y="116" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#333333">协商协议版本</text>
  <text x="55" y="134" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#333333">交换 capabilities</text>
  <text x="55" y="150" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#888888">→ notifications/initialized</text>

  <!-- Arrow 1→2 -->
  <line x1="220" y1="105" x2="245" y2="105" stroke="#888888" stroke-width="2" marker-end="url(#al1)" />
  <polygon points="242,101 250,105 242,109" fill="#888888" />

  <!-- Phase 2: Discovery -->
  <rect x="250" y="55" width="140" height="100" fill="#FFFFFF" stroke="#E76F00" stroke-width="2" rx="8" />
  <rect x="250" y="55" width="140" height="24" fill="#E76F00" rx="8" />
  <text x="320" y="73" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF">2. Discovery</text>
  <text x="265" y="98" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#333333">tools/list</text>
  <text x="265" y="116" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#333333">resources/list</text>
  <text x="265" y="134" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#333333">prompts/list</text>
  <text x="265" y="150" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#888888">动态发现能力</text>

  <!-- Arrow 2→3 -->
  <line x1="390" y1="105" x2="415" y2="105" stroke="#888888" stroke-width="2" marker-end="url(#al2)" />
  <polygon points="412,101 420,105 412,109" fill="#888888" />

  <!-- Phase 3: Operation -->
  <rect x="420" y="55" width="120" height="100" fill="#FFFFFF" stroke="#D32F2F" stroke-width="2" rx="8" />
  <rect x="420" y="55" width="120" height="24" fill="#D32F2F" rx="8" />
  <text x="480" y="73" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF">3. Operation</text>
  <text x="435" y="98" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#333333">tools/call</text>
  <text x="435" y="116" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#333333">resources/read</text>
  <text x="435" y="134" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#333333">prompts/get</text>
  <text x="435" y="150" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#888888">实际使用</text>

  <!-- Message flow section -->
  <rect x="30" y="175" width="510" height="200" fill="#FFFFFF" stroke="#DDDDDD" rx="6" />
  <text x="55" y="197" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#333333">JSON-RPC 2.0 消息示例:</text>

  <!-- Request message -->
  <rect x="50" y="208" width="470" height="44" fill="#F5F5F5" stroke="#00ADD8" rx="4" />
  <text x="65" y="225" font-family="monospace" font-size="10" fill="#00ADD8">Request:</text>
  <text x="65" y="242" font-family="monospace" font-size="9" fill="#333333">{"jsonrpc":"2.0","id":1,"method":"tools/call","params":{"name":"get_weather","arguments":{"city":"Tokyo"}}}</text>

  <!-- Response message -->
  <rect x="50" y="260" width="470" height="44" fill="#F5F5F5" stroke="#E76F00" rx="4" />
  <text x="65" y="277" font-family="monospace" font-size="10" fill="#E76F00">Response:</text>
  <text x="65" y="294" font-family="monospace" font-size="9" fill="#333333">{"jsonrpc":"2.0","id":1,"result":{"content":[{"type":"text","text":"Tokyo: 22C, sunny"}]}}</text>

  <!-- Notification message -->
  <rect x="50" y="312" width="470" height="44" fill="#F5F5F5" stroke="#888888" rx="4" />
  <text x="65" y="329" font-family="monospace" font-size="10" fill="#888888">Notification (无id,不要求响应):</text>
  <text x="65" y="346" font-family="monospace" font-size="9" fill="#333333">{"jsonrpc":"2.0","method":"notifications/tools/list_changed"}</text>
</svg>
