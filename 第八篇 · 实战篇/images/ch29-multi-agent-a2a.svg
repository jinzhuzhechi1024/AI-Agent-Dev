<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" width="560" height="400">
  <defs>
    <style>
      .title { font-family: system-ui, sans-serif; font-size: 16px; font-weight: bold; fill: #333; }
      .agent-name { font-family: system-ui, sans-serif; font-size: 12px; font-weight: bold; fill: #fff; }
      .agent-role { font-family: system-ui, sans-serif; font-size: 10px; fill: #E3F2FD; }
      .msg-label { font-family: system-ui, sans-serif; font-size: 10px; fill: #555; }
      .note { font-family: system-ui, sans-serif; font-size: 11px; fill: #666; }
      .accent { font-family: system-ui, sans-serif; font-size: 11px; font-weight: bold; fill: #D32F2F; }
      .warn { font-family: system-ui, sans-serif; font-size: 11px; font-weight: bold; fill: #F57C00; }
    </style>
    <marker id="arrowR" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L7,4 L0,8" fill="#666"/>
    </marker>
    <marker id="arrowL" markerWidth="8" markerHeight="8" refX="0" refY="4" orient="auto">
      <path d="M8,0 L0,4 L8,8" fill="#666"/>
    </marker>
  </defs>

  <text x="280" y="22" text-anchor="middle" class="title">A2A协议多Agent协作：复杂故障处理流程</text>

  <!-- Incident trigger -->
  <rect x="200" y="40" width="160" height="30" rx="6" fill="#C62828"/>
  <text x="280" y="59" text-anchor="middle" class="agent-name">复杂故障：支付服务全链路超时</text>

  <!-- 4 Agents arranged in diamond -->
  <!-- Top: Intake Agent -->
  <rect x="200" y="90" width="160" height="50" rx="8" fill="#1565C0"/>
  <text x="280" y="110" text-anchor="middle" class="agent-name">Intake Agent</text>
  <text x="280" y="126" text-anchor="middle" class="agent-role">分类·优先级·拓扑丰富</text>

  <!-- Left: Diagnostics Agent -->
  <rect x="30" y="170" width="150" height="50" rx="8" fill="#E65100"/>
  <text x="105" y="190" text-anchor="middle" class="agent-name">Diagnostics Agent</text>
  <text x="105" y="206" text-anchor="middle" class="agent-role">指标查询·K8s状态·只读</text>

  <!-- Right: Log Analysis Agent -->
  <rect x="380" y="170" width="150" height="50" rx="8" fill="#6A1B9A"/>
  <text x="455" y="190" text-anchor="middle" class="agent-name">Log Analysis Agent</text>
  <text x="455" y="206" text-anchor="middle" class="agent-role">日志关联·错误模式·时间线</text>

  <!-- Bottom: Remediation Agent -->
  <rect x="200" y="250" width="160" height="50" rx="8" fill="#2E7D32"/>
  <text x="280" y="270" text-anchor="middle" class="agent-name">Remediation Agent</text>
  <text x="280" y="286" text-anchor="middle" class="agent-role">执行修复·HITL审批·写权限</text>

  <!-- Far bottom: Verification Agent -->
  <rect x="200" y="320" width="160" height="40" rx="6" fill="#546E7A"/>
  <text x="280" y="338" text-anchor="middle" class="agent-name">Verification Agent</text>
  <text x="280" y="352" text-anchor="middle" class="agent-role">健康检查·回归监控·回滚</text>

  <!-- A2A message flows -->
  <path d="M250 140 L130 170" stroke="#666" stroke-width="1.5" marker-end="url(#arrowR)"/>
  <text x="160" y="158" class="msg-label">委派诊断任务</text>

  <path d="M310 140 L430 170" stroke="#666" stroke-width="1.5" marker-end="url(#arrowR)"/>
  <text x="350" y="158" class="msg-label">委派日志分析</text>

  <path d="M130 220 L250 250" stroke="#666" stroke-width="1.5" marker-end="url(#arrowR)"/>
  <text x="155" y="242" class="msg-label">返回指标+K8s状态</text>

  <path d="M430 220 L310 250" stroke="#666" stroke-width="1.5" marker-end="url(#arrowR)"/>
  <text x="345" y="242" class="msg-label">返回错误模式</text>

  <path d="M280 300 L280 320" stroke="#666" stroke-width="1.5" marker-end="url(#arrowR)"/>

  <!-- Warning box -->
  <rect x="30" y="250" width="150" height="40" rx="4" fill="#FFF3E0" stroke="#FFB74D" stroke-width="1"/>
  <text x="105" y="268" text-anchor="middle" class="warn">⚠ A2A安全风险</text>
  <text x="105" y="282" text-anchor="middle" class="msg-label">Session Smuggling</text>

  <text x="280" y="380" text-anchor="middle" class="note">A2A v1.0 (2026.2) · 150+组织 · JSON-RPC 2.0 · Agent Card能力发现</text>
  <text x="280" y="394" text-anchor="middle" class="accent">来源：arXiv 2026 · CSA 2026 · SwarmSignal 2026 · Palo Alto Unit 42 2025</text>
</svg>
