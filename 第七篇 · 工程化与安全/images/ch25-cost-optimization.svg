<?xml version="1.0" encoding="UTF-8"?>
<svg width="560" height="400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow25c" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L6,3 z" fill="#333"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#FAFAFA" rx="8"/>

  <!-- Title -->
  <text x="280" y="28" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" font-weight="bold" fill="#333">Agent成本优化五大策略</text>
  <text x="280" y="46" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#888">综合实施可降低47-80%总成本</text>

  <!-- Strategy stack (top to bottom = implement order) -->

  <!-- 1. Prompt Caching -->
  <rect x="80" y="60" width="400" height="48" fill="#E3F2FD" stroke="#1565C0" stroke-width="2" rx="8"/>
  <text x="100" y="82" font-family="system-ui,sans-serif" font-size="13" font-weight="bold" fill="#1565C0">1. Prompt缓存</text>
  <text x="100" y="98" font-family="system-ui,sans-serif" font-size="11" fill="#555">稳定前缀Token复用，OpenAI自动/Anthropic显式</text>
  <rect x="410" y="70" width="55" height="28" fill="#1565C0" rx="5"/>
  <text x="437" y="89" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="bold" fill="#FFF">34-90%</text>

  <line x1="280" y1="108" x2="280" y2="118" stroke="#333" stroke-width="1.5" marker-end="url(#arrow25c)"/>

  <!-- 2. Semantic Caching -->
  <rect x="80" y="120" width="400" height="48" fill="#FFF3E0" stroke="#E76F00" stroke-width="2" rx="8"/>
  <text x="100" y="142" font-family="system-ui,sans-serif" font-size="13" font-weight="bold" fill="#E76F00">2. 语义缓存</text>
  <text x="100" y="158" font-family="system-ui,sans-serif" font-size="11" fill="#555">Embedding相似度匹配，Redis/GPTCache后端</text>
  <rect x="410" y="130" width="55" height="28" fill="#E76F00" rx="5"/>
  <text x="437" y="149" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="bold" fill="#FFF">40-70%</text>

  <line x1="280" y1="168" x2="280" y2="178" stroke="#333" stroke-width="1.5" marker-end="url(#arrow25c)"/>

  <!-- 3. Model Routing -->
  <rect x="80" y="180" width="400" height="48" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2" rx="8"/>
  <text x="100" y="202" font-family="system-ui,sans-serif" font-size="13" font-weight="bold" fill="#2E7D32">3. 模型分级路由</text>
  <text x="100" y="218" font-family="system-ui,sans-serif" font-size="11" fill="#555">简单→gpt-4o-mini · 复杂→GPT-4o/Claude</text>
  <rect x="410" y="190" width="55" height="28" fill="#2E7D32" rx="5"/>
  <text x="437" y="209" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="bold" fill="#FFF">40-85%</text>

  <line x1="280" y1="228" x2="280" y2="238" stroke="#333" stroke-width="1.5" marker-end="url(#arrow25c)"/>

  <!-- 4. Prompt Compression -->
  <rect x="80" y="240" width="400" height="48" fill="#F3E5F5" stroke="#7B1FA2" stroke-width="2" rx="8"/>
  <text x="100" y="262" font-family="system-ui,sans-serif" font-size="13" font-weight="bold" fill="#7B1FA2">4. Prompt精简压缩</text>
  <text x="100" y="278" font-family="system-ui,sans-serif" font-size="11" fill="#555">LLMLingua压缩 · max_tokens限制 · YAML结构化</text>
  <rect x="410" y="250" width="55" height="28" fill="#7B1FA2" rx="5"/>
  <text x="437" y="269" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="bold" fill="#FFF">30-60%</text>

  <line x1="280" y1="288" x2="280" y2="298" stroke="#333" stroke-width="1.5" marker-end="url(#arrow25c)"/>

  <!-- 5. Batch Processing -->
  <rect x="80" y="300" width="400" height="48" fill="#FFEBEE" stroke="#D32F2F" stroke-width="2" rx="8"/>
  <text x="100" y="322" font-family="system-ui,sans-serif" font-size="13" font-weight="bold" fill="#D32F2F">5. 批量推理</text>
  <text x="100" y="338" font-family="system-ui,sans-serif" font-size="11" fill="#555">异步任务50%折扣，非实时场景适用</text>
  <rect x="410" y="310" width="55" height="28" fill="#D32F2F" rx="5"/>
  <text x="437" y="329" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="bold" fill="#FFF">50%</text>

  <!-- Bottom annotation -->
  <text x="280" y="372" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#333">实施顺序：缓存优先（零质量损耗）→ 路由 → 压缩</text>
  <text x="280" y="388" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#888">来源：RouteLLM (ICLR 2025) · Anthropic/OpenAI官方文档 · 2025-2026生产实践</text>
</svg>
