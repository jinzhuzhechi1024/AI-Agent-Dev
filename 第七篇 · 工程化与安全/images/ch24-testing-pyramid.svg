<?xml version="1.0" encoding="UTF-8"?>
<svg width="560" height="400" xmlns="http://www.w3.org/2000/svg">
  <rect width="560" height="400" fill="#FAFAFA" rx="8"/>

  <text x="280" y="28" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="16" font-weight="bold" fill="#333">Agent 测试金字塔</text>

  <!-- 第四层：对抗测试（顶部） -->
  <polygon points="200,60 360,60 340,110 220,110" fill="#FCE4EC" stroke="#C62828" stroke-width="2"/>
  <text x="280" y="82" text-anchor="middle" font-size="13" font-weight="bold" fill="#C62828">对抗测试</text>
  <text x="280" y="100" text-anchor="middle" font-size="10" fill="#555">注入攻击 · 越狱 · 边界探测</text>

  <!-- 第三层：端到端测试 -->
  <polygon points="220,110 340,110 320,175 240,175" fill="#FFF3E0" stroke="#E65100" stroke-width="2"/>
  <text x="280" y="135" text-anchor="middle" font-size="13" font-weight="bold" fill="#E65100">端到端测试</text>
  <text x="280" y="153" text-anchor="middle" font-size="10" fill="#555">完整任务 · 多轮对话</text>
  <text x="280" y="168" text-anchor="middle" font-size="10" fill="#555">黄金集 · 回放测试</text>

  <!-- 第二层：集成测试 -->
  <polygon points="240,175 320,175 300,240 260,240" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2"/>
  <text x="280" y="200" text-anchor="middle" font-size="13" font-weight="bold" fill="#2E7D32">集成测试</text>
  <text x="280" y="218" text-anchor="middle" font-size="10" fill="#555">轨迹评估</text>
  <text x="280" y="233" text-anchor="middle" font-size="10" fill="#555">工具链 · 多步骤</text>

  <!-- 第一层：单元测试（底部） -->
  <polygon points="200,240 360,240 340,305 220,305" fill="#E3F2FD" stroke="#1565C0" stroke-width="2"/>
  <text x="280" y="265" text-anchor="middle" font-size="13" font-weight="bold" fill="#1565C0">单元测试</text>
  <text x="280" y="283" text-anchor="middle" font-size="10" fill="#555">工具选择 · 参数校验</text>
  <text x="280" y="298" text-anchor="middle" font-size="10" fill="#555">Schema验证</text>

  <!-- 侧面标注 -->
  <text x="420" y="85" font-size="11" fill="#C62828" font-weight="bold">频率：低</text>
  <text x="420" y="145" font-size="11" fill="#E65100" font-weight="bold">频率：中</text>
  <text x="420" y="205" font-size="11" fill="#2E7D32" font-weight="bold">频率：高</text>
  <text x="420" y="270" font-size="11" fill="#1565C0" font-weight="bold">频率：最高</text>

  <line x1="395" y1="80" x2="375" y2="80" stroke="#C62828" stroke-width="1"/>
  <line x1="395" y1="140" x2="345" y2="140" stroke="#E65100" stroke-width="1"/>
  <line x1="395" y1="200" x2="320" y2="200" stroke="#2E7D32" stroke-width="1"/>
  <line x1="395" y1="265" x2="360" y2="265" stroke="#1565C0" stroke-width="1"/>

  <!-- 底部标注 -->
  <text x="280" y="340" text-anchor="middle" font-size="12" fill="#D32F2F">⚡ 底层跑得勤、顶层跑得深 — 与传统金字塔同构但语义不同</text>
  <text x="280" y="360" text-anchor="middle" font-size="11" fill="#666">每次Prompt/模型变更 → 跑单元+集成；每次发布 → 跑端到端+对抗</text>
  <text x="280" y="378" text-anchor="middle" font-size="11" fill="#666">关键：非确定性系统必须多次运行取统计分布，不能只跑一次</text>
</svg>
