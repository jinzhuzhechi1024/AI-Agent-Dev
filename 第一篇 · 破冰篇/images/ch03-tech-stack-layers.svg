<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="system-ui, -apple-system, sans-serif">
  <!-- Title -->
  <text x="280" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#333333">Agent 技术栈分层</text>

  <!-- Layer 4: Platform -->
  <rect x="60" y="55" width="440" height="65" rx="8" fill="#E76F00" opacity="0.12" stroke="#E76F00" stroke-width="1.5"/>
  <text x="80" y="80" font-size="13" font-weight="bold" fill="#E76F00">平台层</text>
  <text x="80" y="100" font-size="10" fill="#555555">Codex CLI · Claude Code · Coze · Dify</text>
  <text x="80" y="114" font-size="9" fill="#888888" font-style="italic">开箱即用的 Agent 产品</text>

  <!-- Arrow down -->
  <path d="M 280 120 L 280 132" stroke="#888888" stroke-width="1.5" marker-end="url(#arrowDown)"/>

  <!-- Layer 3: Framework -->
  <rect x="60" y="135" width="440" height="65" rx="8" fill="#00ADD8" opacity="0.12" stroke="#00ADD8" stroke-width="1.5"/>
  <text x="80" y="160" font-size="13" font-weight="bold" fill="#00ADD8">框架层</text>
  <text x="80" y="180" font-size="10" fill="#555555">LangGraph · OpenAI Agents SDK · CrewAI · AutoGen</text>
  <text x="80" y="194" font-size="9" fill="#888888" font-style="italic">Agent 编排与状态管理</text>

  <!-- Arrow down -->
  <path d="M 280 200 L 280 212" stroke="#888888" stroke-width="1.5" marker-end="url(#arrowDown)"/>

  <!-- Layer 2: Tools -->
  <rect x="60" y="215" width="440" height="65" rx="8" fill="#E76F00" opacity="0.08" stroke="#E76F00" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="80" y="240" font-size="13" font-weight="bold" fill="#E76F00">工具层</text>
  <text x="80" y="260" font-size="10" fill="#555555">MCP 协议 · MCP Servers · Function Calling</text>
  <text x="80" y="274" font-size="9" fill="#888888" font-style="italic">标准化工具调用生态</text>

  <!-- Arrow down -->
  <path d="M 280 280 L 280 292" stroke="#888888" stroke-width="1.5" marker-end="url(#arrowDown)"/>

  <!-- Layer 1: Model -->
  <rect x="60" y="295" width="440" height="65" rx="8" fill="#333333" opacity="0.08" stroke="#333333" stroke-width="1.5"/>
  <text x="80" y="320" font-size="13" font-weight="bold" fill="#333333">模型层</text>
  <text x="80" y="340" font-size="10" fill="#555555">GPT · Claude · DeepSeek · Llama · Qwen</text>
  <text x="80" y="354" font-size="9" fill="#888888" font-style="italic">基础推理能力</text>

  <!-- Arrow marker -->
  <defs>
    <marker id="arrowDown" markerWidth="8" markerHeight="6" refX="4" refY="6" orient="auto">
      <polygon points="0 0, 8 0, 4 6" fill="#888888"/>
    </marker>
  </defs>

  <!-- Side label -->
  <text x="510" y="200" text-anchor="middle" font-size="10" fill="#AAAAAA" transform="rotate(90, 510, 200)">抽象程度递增</text>
</svg>
