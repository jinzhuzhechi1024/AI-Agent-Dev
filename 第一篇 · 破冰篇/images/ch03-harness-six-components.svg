<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="system-ui, -apple-system, sans-serif">
  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#333333">Harness 六大组件</text>

  <!-- Center circle: Agent Core -->
  <circle cx="280" cy="220" r="48" fill="#333333" opacity="0.1" stroke="#333333" stroke-width="2"/>
  <text x="280" y="215" text-anchor="middle" font-size="13" font-weight="bold" fill="#333333">Agent</text>
  <text x="280" y="232" text-anchor="middle" font-size="11" fill="#555555">Loop</text>

  <!-- Component 1: File System (top-left) -->
  <rect x="30" y="60" width="145" height="60" rx="6" fill="#FFFFFF" stroke="#E76F00" stroke-width="1.5"/>
  <text x="102" y="85" text-anchor="middle" font-size="12" font-weight="bold" fill="#E76F00">文件系统</text>
  <text x="102" y="105" text-anchor="middle" font-size="9" fill="#888888">存储 · 版本 · 工作区</text>
  <line x1="150" y1="100" x2="232" y2="195" stroke="#E76F00" stroke-width="1" opacity="0.4"/>

  <!-- Component 2: Bash + Sandbox (top-right) -->
  <rect x="385" y="60" width="145" height="60" rx="6" fill="#FFFFFF" stroke="#E76F00" stroke-width="1.5"/>
  <text x="457" y="85" text-anchor="middle" font-size="12" font-weight="bold" fill="#E76F00">Bash + 沙箱</text>
  <text x="457" y="105" text-anchor="middle" font-size="9" fill="#888888">代码执行 · 安全隔离</text>
  <line x1="410" y1="100" x2="328" y2="195" stroke="#E76F00" stroke-width="1" opacity="0.4"/>

  <!-- Component 3: Memory (left) -->
  <rect x="15" y="190" width="145" height="60" rx="6" fill="#FFFFFF" stroke="#00ADD8" stroke-width="1.5"/>
  <text x="87" y="215" text-anchor="middle" font-size="12" font-weight="bold" fill="#00ADD8">记忆</text>
  <text x="87" y="235" text-anchor="middle" font-size="9" fill="#888888">短期 · 工作 · 长期</text>
  <line x1="155" y1="220" x2="232" y2="220" stroke="#00ADD8" stroke-width="1" opacity="0.4"/>

  <!-- Component 4: Web Search + MCP (right) -->
  <rect x="400" y="190" width="145" height="60" rx="6" fill="#FFFFFF" stroke="#00ADD8" stroke-width="1.5"/>
  <text x="472" y="215" text-anchor="middle" font-size="12" font-weight="bold" fill="#00ADD8">Web Search</text>
  <text x="472" y="231" text-anchor="middle" font-size="10" fill="#00ADD8">+ MCP</text>
  <text x="472" y="243" text-anchor="middle" font-size="9" fill="#888888">实时知识 · 工具调用</text>
  <line x1="405" y1="220" x2="328" y2="220" stroke="#00ADD8" stroke-width="1" opacity="0.4"/>

  <!-- Component 5: Context Engineering (bottom-left) -->
  <rect x="30" y="320" width="145" height="60" rx="6" fill="#FFFFFF" stroke="#E76F00" stroke-width="1.5"/>
  <text x="102" y="345" text-anchor="middle" font-size="12" font-weight="bold" fill="#E76F00">上下文工程</text>
  <text x="102" y="365" text-anchor="middle" font-size="9" fill="#888888">压缩 · 路由 · 防腐烂</text>
  <line x1="150" y1="340" x2="232" y2="245" stroke="#E76F00" stroke-width="1" opacity="0.4"/>

  <!-- Component 6: Orchestration + Hooks (bottom-right) -->
  <rect x="385" y="320" width="145" height="60" rx="6" fill="#FFFFFF" stroke="#E76F00" stroke-width="1.5"/>
  <text x="457" y="345" text-anchor="middle" font-size="11" font-weight="bold" fill="#E76F00">编排 + Hooks</text>
  <text x="457" y="365" text-anchor="middle" font-size="9" fill="#888888">多 Agent · 生命周期拦截</text>
  <line x1="410" y1="340" x2="328" y2="245" stroke="#E76F00" stroke-width="1" opacity="0.4"/>

  <!-- Labels for categories -->
  <text x="102" y="50" text-anchor="middle" font-size="9" fill="#AAAAAA" font-style="italic">环境</text>
  <text x="472" y="50" text-anchor="middle" font-size="9" fill="#AAAAAA" font-style="italic">执行</text>
  <text x="87" y="180" text-anchor="middle" font-size="9" fill="#AAAAAA" font-style="italic">状态</text>
  <text x="472" y="180" text-anchor="middle" font-size="9" fill="#AAAAAA" font-style="italic">知识</text>
  <text x="102" y="395" text-anchor="middle" font-size="9" fill="#AAAAAA" font-style="italic">信息</text>
  <text x="472" y="395" text-anchor="middle" font-size="9" fill="#AAAAAA" font-style="italic">控制</text>
</svg>
