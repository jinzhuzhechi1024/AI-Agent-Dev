<?xml version="1.0" encoding="UTF-8"?>
<svg width="520" height="380" xmlns="http://www.w3.org/2000/svg">
  <!-- 背景 -->
  <rect width="520" height="380" fill="#FAFAFA" rx="8"/>

  <!-- 标题 -->
  <text x="260" y="30" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" font-weight="bold" fill="#333">Agent = Model + Harness</text>

  <!-- 公式行 -->
  <text x="260" y="70" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" fill="#666">2026 年业界共识公式</text>

  <!-- Model 框（左） -->
  <rect x="40" y="100" width="180" height="120" fill="#FFF3E0" stroke="#E76F00" stroke-width="2" rx="8"/>
  <text x="130" y="125" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" font-weight="bold" fill="#E76F00">Model（模型）</text>
  <text x="130" y="148" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#333">大语言模型 LLM</text>
  <text x="130" y="166" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#333">GPT / Claude / DeepSeek</text>
  <text x="130" y="190" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#666">提供"智能"</text>
  <text x="130" y="208" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#666">擅长推理、生成、理解</text>

  <!-- 加号 -->
  <text x="260" y="170" text-anchor="middle" font-family="system-ui,sans-serif" font-size="28" font-weight="bold" fill="#333">+</text>

  <!-- Harness 框（右） -->
  <rect x="300" y="100" width="180" height="120" fill="#E3F2FD" stroke="#1565C0" stroke-width="2" rx="8"/>
  <text x="390" y="125" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" font-weight="bold" fill="#1565C0">Harness（马具）</text>
  <text x="390" y="148" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#333">上下文 + 约束 + 工具</text>
  <text x="390" y="166" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#333">沙箱 + 记忆 + Hooks</text>
  <text x="390" y="190" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#666">让智能"可靠"</text>
  <text x="390" y="208" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#666">负责执行、约束、纠错</text>

  <!-- 等号 -->
  <text x="260" y="260" text-anchor="middle" font-family="system-ui,sans-serif" font-size="20" fill="#333">↓</text>

  <!-- Agent 框（底部） -->
  <rect x="140" y="270" width="240" height="60" fill="#F5F5F5" stroke="#333" stroke-width="2" rx="8"/>
  <text x="260" y="295" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" font-weight="bold" fill="#333">Agent（智能体）</text>
  <text x="260" y="315" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#666">能自主感知、决策、执行、学习</text>

  <!-- 底部说明 -->
  <text x="260" y="360" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#D32F2F">⚡ 好马具比好马更重要——LangChain 实验证据</text>
</svg>
