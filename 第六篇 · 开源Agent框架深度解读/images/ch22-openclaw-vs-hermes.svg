<?xml version="1.0" encoding="UTF-8"?>
<svg width="560" height="400" xmlns="http://www.w3.org/2000/svg">
  <rect width="560" height="400" fill="#FAFAFA" rx="8"/>

  <text x="280" y="28" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="16" font-weight="bold" fill="#333">OpenClaw vs Hermes：两种Agent哲学</text>

  <!-- 分割线 -->
  <line x1="280" y1="50" x2="280" y2="380" stroke="#CCC" stroke-dasharray="5,3"/>

  <!-- 左侧 OpenClaw -->
  <text x="140" y="72" text-anchor="middle" font-size="14" font-weight="bold" fill="#1565C0">OpenClaw</text>
  <text x="140" y="90" text-anchor="middle" font-size="11" fill="#666">瑞士军刀哲学</text>

  <rect x="50" y="105" width="180" height="35" fill="#E3F2FD" stroke="#1565C0" rx="5"/>
  <text x="140" y="127" text-anchor="middle" font-size="11" fill="#333">技能：市场采购(5400+)</text>

  <rect x="50" y="150" width="180" height="35" fill="#E3F2FD" stroke="#1565C0" rx="5"/>
  <text x="140" y="172" text-anchor="middle" font-size="11" fill="#333">记忆：双模(热+冷)</text>

  <rect x="50" y="195" width="180" height="35" fill="#E3F2FD" stroke="#1565C0" rx="5"/>
  <text x="140" y="217" text-anchor="middle" font-size="11" fill="#333">进化：静态(不自学)</text>

  <rect x="50" y="240" width="180" height="35" fill="#E3F2FD" stroke="#1565C0" rx="5"/>
  <text x="140" y="262" text-anchor="middle" font-size="11" fill="#333">平台：TypeScript</text>

  <rect x="50" y="285" width="180" height="35" fill="#E3F2FD" stroke="#1565C0" rx="5"/>
  <text x="140" y="307" text-anchor="middle" font-size="11" fill="#333">IM：26+平台</text>

  <text x="140" y="345" text-anchor="middle" font-size="10" fill="#D32F2F">优势：生态大·门槛低</text>
  <text x="140" y="362" text-anchor="middle" font-size="10" fill="#D32F2F">劣势：不会自我进化</text>

  <!-- 右侧 Hermes -->
  <text x="420" y="72" text-anchor="middle" font-size="14" font-weight="bold" fill="#2E7D32">Hermes Agent</text>
  <text x="420" y="90" text-anchor="middle" font-size="11" fill="#666">数字分身哲学</text>

  <rect x="330" y="105" width="180" height="35" fill="#E8F5E9" stroke="#2E7D32" rx="5"/>
  <text x="420" y="127" text-anchor="middle" font-size="11" fill="#333">技能：自动生成(600+)</text>

  <rect x="330" y="150" width="180" height="35" fill="#E8F5E9" stroke="#2E7D32" rx="5"/>
  <text x="420" y="172" text-anchor="middle" font-size="11" fill="#333">记忆：三层(工+情+技)</text>

  <rect x="330" y="195" width="180" height="35" fill="#E8F5E9" stroke="#2E7D32" rx="5"/>
  <text x="420" y="217" text-anchor="middle" font-size="11" fill="#333">进化：闭环(自学习)</text>

  <rect x="330" y="240" width="180" height="35" fill="#E8F5E9" stroke="#2E7D32" rx="5"/>
  <text x="420" y="262" text-anchor="middle" font-size="11" fill="#333">平台：Python</text>

  <rect x="330" y="285" width="180" height="35" fill="#E8F5E9" stroke="#2E7D32" rx="5"/>
  <text x="420" y="307" text-anchor="middle" font-size="11" fill="#333">IM：14+平台</text>

  <text x="420" y="345" text-anchor="middle" font-size="10" fill="#D32F2F">优势：越用越聪明</text>
  <text x="420" y="362" text-anchor="middle" font-size="10" fill="#D32F2F">劣势：生态较小</text>

  <!-- 底部标注 -->
  <text x="280" y="388" text-anchor="middle" font-size="11" fill="#666">同一个目标不同路径：广度覆盖 vs 深度进化</text>

  <defs>
  </defs>
</svg>
