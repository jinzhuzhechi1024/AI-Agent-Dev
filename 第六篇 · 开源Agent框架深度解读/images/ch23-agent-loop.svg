<?xml version="1.0" encoding="UTF-8"?>
<svg width="560" height="400" xmlns="http://www.w3.org/2000/svg">
  <rect width="560" height="400" fill="#FAFAFA" rx="8"/>

  <text x="280" y="28" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="16" font-weight="bold" fill="#333">Codex Agent Loop 设计</text>

  <!-- 六步循环，环形排列 -->
  <!-- 中心 -->
  <circle cx="280" cy="215" r="38" fill="#FFF3E0" stroke="#E65100" stroke-width="2.5"/>
  <text x="280" y="212" text-anchor="middle" font-size="11" font-weight="bold" fill="#E65100">Agent</text>
  <text x="280" y="227" text-anchor="middle" font-size="10" fill="#E65100">Loop</text>

  <!-- 1. 用户输入 (左上) -->
  <rect x="45" y="80" width="120" height="50" fill="#E3F2FD" stroke="#1565C0" stroke-width="2" rx="8"/>
  <text x="105" y="102" text-anchor="middle" font-size="12" font-weight="bold" fill="#1565C0">1.用户输入</text>
  <text x="105" y="118" text-anchor="middle" font-size="9" fill="#555">自然语言指令</text>

  <!-- 2. Prompt组装 (上) -->
  <rect x="220" y="50" width="120" height="50" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2" rx="8"/>
  <text x="280" y="72" text-anchor="middle" font-size="12" font-weight="bold" fill="#2E7D32">2.Prompt组装</text>
  <text x="280" y="88" text-anchor="middle" font-size="9" fill="#555">AGENTS.md+上下文</text>

  <!-- 3. 模型推理 (右上) -->
  <rect x="395" y="80" width="120" height="50" fill="#FFF3E0" stroke="#E65100" stroke-width="2" rx="8"/>
  <text x="455" y="102" text-anchor="middle" font-size="12" font-weight="bold" fill="#E65100">3.模型推理</text>
  <text x="455" y="118" text-anchor="middle" font-size="9" fill="#555">GPT-5.5-Codex</text>

  <!-- 4. 工具调用 (右下) -->
  <rect x="395" y="260" width="120" height="50" fill="#FCE4EC" stroke="#C62828" stroke-width="2" rx="8"/>
  <text x="455" y="282" text-anchor="middle" font-size="12" font-weight="bold" fill="#C62828">4.工具调用</text>
  <text x="455" y="298" text-anchor="middle" font-size="9" fill="#555">Read/Write/Bash</text>

  <!-- 5. 结果反馈 (下) -->
  <rect x="220" y="340" width="120" height="45" fill="#F3E5F5" stroke="#7B1FA2" stroke-width="2" rx="8"/>
  <text x="280" y="360" text-anchor="middle" font-size="12" font-weight="bold" fill="#7B1FA2">5.结果反馈</text>
  <text x="280" y="376" text-anchor="middle" font-size="9" fill="#555">注入上下文</text>

  <!-- 6. 循环判断 (左下) -->
  <rect x="45" y="260" width="120" height="50" fill="#E0F2F1" stroke="#00695C" stroke-width="2" rx="8"/>
  <text x="105" y="282" text-anchor="middle" font-size="12" font-weight="bold" fill="#00695C">6.循环判断</text>
  <text x="105" y="298" text-anchor="middle" font-size="9" fill="#555">完成? → 返回</text>

  <!-- 环形箭头（顺时针） -->
  <path d="M 165 105 Q 200 75 220 70" fill="none" stroke="#333" stroke-width="1.8" marker-end="url(#arrL)"/>
  <path d="M 340 70 Q 370 75 395 105" fill="none" stroke="#333" stroke-width="1.8" marker-end="url(#arrL)"/>
  <path d="M 455 130 Q 475 190 455 260" fill="none" stroke="#333" stroke-width="1.8" marker-end="url(#arrL)"/>
  <path d="M 395 310 Q 360 335 340 345" fill="none" stroke="#333" stroke-width="1.8" marker-end="url(#arrL)"/>
  <path d="M 220 345 Q 180 335 165 310" fill="none" stroke="#333" stroke-width="1.8" marker-end="url(#arrL)"/>
  <path d="M 105 260 Q 85 190 105 130" fill="none" stroke="#333" stroke-width="1.8" marker-end="url(#arrL)"/>

  <!-- 中心到各节点连线（虚线表示交互） -->
  <line x1="280" y1="177" x2="280" y2="100" stroke="#CCC" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="318" y1="215" x2="395" y2="105" stroke="#CCC" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="318" y1="215" x2="395" y2="285" stroke="#CCC" stroke-width="1" stroke-dasharray="3,2"/>

  <defs>
    <marker id="arrL" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L6,3 z" fill="#333"/>
    </marker>
  </defs>
</svg>
