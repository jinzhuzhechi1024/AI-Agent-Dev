<?xml version="1.0" encoding="UTF-8"?>
<svg width="560" height="400" xmlns="http://www.w3.org/2000/svg">
  <rect width="560" height="400" fill="#FAFAFA" rx="8"/>

  <text x="280" y="28" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="16" font-weight="bold" fill="#333">Hermes 闭环学习系统</text>

  <!-- 中心圆 -->
  <circle cx="280" cy="210" r="45" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2.5"/>
  <text x="280" y="207" text-anchor="middle" font-size="12" font-weight="bold" fill="#2E7D32">自进化</text>
  <text x="280" y="223" text-anchor="middle" font-size="10" fill="#2E7D32">核心引擎</text>

  <!-- 五个节点，环形排列 -->
  <!-- Observe (上) -->
  <rect x="225" y="60" width="110" height="45" fill="#E3F2FD" stroke="#1565C0" stroke-width="2" rx="8"/>
  <text x="280" y="82" text-anchor="middle" font-size="13" font-weight="bold" fill="#1565C0">Observe</text>
  <text x="280" y="97" text-anchor="middle" font-size="10" fill="#555">观察用户需求</text>

  <!-- Execute (右上) -->
  <rect x="385" y="115" width="110" height="45" fill="#FFF3E0" stroke="#E65100" stroke-width="2" rx="8"/>
  <text x="440" y="137" text-anchor="middle" font-size="13" font-weight="bold" fill="#E65100">Execute</text>
  <text x="440" y="152" text-anchor="middle" font-size="10" fill="#555">执行任务</text>

  <!-- Reflect (右下) -->
  <rect x="385" y="260" width="110" height="45" fill="#FCE4EC" stroke="#C62828" stroke-width="2" rx="8"/>
  <text x="440" y="282" text-anchor="middle" font-size="13" font-weight="bold" fill="#C62828">Reflect</text>
  <text x="440" y="297" text-anchor="middle" font-size="10" fill="#555">反思效果</text>

  <!-- Crystallize (左下) -->
  <rect x="65" y="260" width="110" height="45" fill="#F3E5F5" stroke="#7B1FA2" stroke-width="2" rx="8"/>
  <text x="120" y="282" text-anchor="middle" font-size="13" font-weight="bold" fill="#7B1FA2">Crystallize</text>
  <text x="120" y="297" text-anchor="middle" font-size="10" fill="#555">沉淀为技能</text>

  <!-- Reuse (左上) -->
  <rect x="65" y="115" width="110" height="45" fill="#E0F2F1" stroke="#00695C" stroke-width="2" rx="8"/>
  <text x="120" y="137" text-anchor="middle" font-size="13" font-weight="bold" fill="#00695C">Reuse</text>
  <text x="120" y="152" text-anchor="middle" font-size="10" fill="#555">复用技能</text>

  <!-- 环形箭头：顺时针 -->
  <path d="M 335 82 Q 400 85 410 115" fill="none" stroke="#333" stroke-width="2" marker-end="url(#arrowCW)"/>
  <path d="M 440 160 Q 460 200 440 260" fill="none" stroke="#333" stroke-width="2" marker-end="url(#arrowCW)"/>
  <path d="M 385 282 Q 350 305 175 282" fill="none" stroke="#333" stroke-width="2" marker-end="url(#arrowCW)"/>
  <path d="M 120 260 Q 100 200 120 160" fill="none" stroke="#333" stroke-width="2" marker-end="url(#arrowCW)"/>
  <path d="M 175 137 Q 220 100 225 82" fill="none" stroke="#333" stroke-width="2" marker-end="url(#arrowCW)"/>

  <!-- 底部标注 -->
  <text x="280" y="355" text-anchor="middle" font-size="12" fill="#D32F2F">⚡ 第100次对话比第1次更好 — 经验自动沉淀为可复用技能</text>
  <text x="280" y="375" text-anchor="middle" font-size="11" fill="#666">触发条件：5+工具调用的复杂任务完成后自动进入反思阶段</text>

  <defs>
    <marker id="arrowCW" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L6,3 z" fill="#333"/>
    </marker>
  </defs>
</svg>
