<?xml version="1.0" encoding="UTF-8"?>
<svg width="560" height="400" xmlns="http://www.w3.org/2000/svg">
  <rect width="560" height="400" fill="#FAFAFA" rx="8"/>

  <text x="280" y="28" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="16" font-weight="bold" fill="#333">OpenClaw 三层架构</text>

  <!-- 第一层：Gateway -->
  <rect x="40" y="50" width="480" height="70" fill="#E3F2FD" stroke="#1565C0" stroke-width="2" rx="8"/>
  <text x="280" y="72" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="bold" fill="#1565C0">Gateway 网关层</text>
  <rect x="70" y="85" width="120" height="28" fill="#FFF" stroke="#1565C0" rx="4"/>
  <text x="130" y="103" text-anchor="middle" font-size="11" fill="#333">WebSocket 服务</text>
  <rect x="220" y="85" width="120" height="28" fill="#FFF" stroke="#1565C0" rx="4"/>
  <text x="280" y="103" text-anchor="middle" font-size="11" fill="#333">消息路由</text>
  <rect x="370" y="85" width="120" height="28" fill="#FFF" stroke="#1565C0" rx="4"/>
  <text x="430" y="103" text-anchor="middle" font-size="11" fill="#333">会话管理</text>

  <!-- 箭头1 -->
  <line x1="280" y1="120" x2="280" y2="145" stroke="#333" stroke-width="2" marker-end="url(#arrowDown)"/>

  <!-- 第二层：Agent -->
  <rect x="40" y="150" width="480" height="70" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2" rx="8"/>
  <text x="280" y="172" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="bold" fill="#2E7D32">Agent 智能体层</text>
  <rect x="70" y="185" width="120" height="28" fill="#FFF" stroke="#2E7D32" rx="4"/>
  <text x="130" y="203" text-anchor="middle" font-size="11" fill="#333">Pi Agent Core</text>
  <rect x="220" y="185" width="120" height="28" fill="#FFF" stroke="#2E7D32" rx="4"/>
  <text x="280" y="203" text-anchor="middle" font-size="11" fill="#333">Skills 引擎</text>
  <rect x="370" y="185" width="120" height="28" fill="#FFF" stroke="#2E7D32" rx="4"/>
  <text x="430" y="203" text-anchor="middle" font-size="11" fill="#333">双模记忆</text>

  <!-- 箭头2 -->
  <line x1="280" y1="220" x2="280" y2="245" stroke="#333" stroke-width="2" marker-end="url(#arrowDown)"/>

  <!-- 第三层：Workspace -->
  <rect x="40" y="250" width="480" height="70" fill="#FFF3E0" stroke="#E65100" stroke-width="2" rx="8"/>
  <text x="280" y="272" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="bold" fill="#E65100">Workspace 工作空间层</text>
  <rect x="55" y="285" width="85" height="28" fill="#FFF" stroke="#E65100" rx="4"/>
  <text x="97" y="303" text-anchor="middle" font-size="10" fill="#333">SOUL.md</text>
  <rect x="155" y="285" width="85" height="28" fill="#FFF" stroke="#E65100" rx="4"/>
  <text x="197" y="303" text-anchor="middle" font-size="10" fill="#333">MEMORY.md</text>
  <rect x="255" y="285" width="85" height="28" fill="#FFF" stroke="#E65100" rx="4"/>
  <text x="297" y="303" text-anchor="middle" font-size="10" fill="#333">AGENTS.md</text>
  <rect x="355" y="285" width="85" height="28" fill="#FFF" stroke="#E65100" rx="4"/>
  <text x="397" y="303" text-anchor="middle" font-size="10" fill="#333">TOOLS.md</text>
  <rect x="455" y="285" width="55" height="28" fill="#FFF" stroke="#E65100" rx="4"/>
  <text x="482" y="303" text-anchor="middle" font-size="10" fill="#333">SQLite</text>

  <!-- 底部标注 -->
  <text x="280" y="355" text-anchor="middle" font-size="12" fill="#D32F2F">⚡ 核心设计：文件驱动 — 用 Markdown 文件替代数据库表</text>
  <text x="280" y="375" text-anchor="middle" font-size="11" fill="#666">Gateway 路由消息 → Agent 推理决策 → Workspace 持久化状态</text>

  <defs>
    <marker id="arrowDown" markerWidth="10" markerHeight="10" refX="5" refY="8" orient="auto">
      <path d="M0,0 L10,0 L5,8 z" fill="#333"/>
    </marker>
  </defs>
</svg>
